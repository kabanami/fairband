[project]
name = "fairband"
version = "0.1.0"
description = "A local valuation screen for a value investor."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fairband = "fairband.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pycountry>=26.2.16",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairband"]

[tool.ruff]
line-length = 100
# The documents under docs/ quote Python in Markdown; Ruff must not rewrite them. The design
# system under web/static is a vendored copy, kept as exported (its token script included).
extend-exclude = ["docs", "src/fairband/web/static"]

[tool.mypy]
strict = true
python_version = "3.13"
exclude = ["^src/fairband/web/static/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The shared test builders import as ``support``.
pythonpath = ["tests"]
filterwarnings = [
    # Starlette's test client asks for httpx2; httpx, which the project already uses, still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
