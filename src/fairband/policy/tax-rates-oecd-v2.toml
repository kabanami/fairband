# Statutory corporate income tax rates: the OECD combined (central plus sub-central) rate, the
# labelled fallback for a company's marginal tax rate (research.md D9). Rates are decimal fractions.
# Country names are the OECD's. Series: dataflow OECD.CTP.TPS:DSD_TAX_CIT@DF_CIT(2.0), MEASURE=CIT_C
# (combined corporate income tax rate), TARGETING=ST (statutory), SECTOR=S13 (general government),
# retrieved 2026-11-06. Cyprus and Taiwan, which the series lacks, are written by hand at the end,
# each row with its own source; the engine cites [meta]'s source for every rate. A jurisdiction in
# neither, Puerto Rico among them, has no rows.
# Data explorer: https://data-explorer.oecd.org/vis?df[ds]=dsDisseminateFinalDMZ&df[id]=DSD_TAX_CIT%40DF_CIT&df[ag]=OECD.CTP.TPS
# Generated by scripts/build_tax_table.py from the series' CSV export; edit the script,
# not this file.

[meta]
source = "OECD Corporate Tax Statistics, Table II.1 statutory corporate income tax rates, combined central and sub-central"
url = "https://sdmx.oecd.org/public/rest/data/OECD.CTP.TPS,DSD_TAX_CIT@DF_CIT,2.0/all?startPeriod=2014&dimensionAtObservation=AllDimensions"
retrieved = "2026-11-06"

