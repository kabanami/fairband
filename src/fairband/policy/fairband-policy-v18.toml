# Fairband policy v18: every valuation constant the engine reads, each with its source line.
#
# v5 is v4 with the FMP pace and the 429 hold (refresh), six financial industries excluded and
# the manual admission list (universe), the designation edges, and the values of the Decline and
# Start-up routes: the run-off horizon and recovery, the distress-sale fraction, the synthetic
# rating table, the ten-year default probabilities, the Altman Z'' zones, the Piotroski low group
# and the burn cover flag (spec 2026-11-03 section 12, founder decisions 2026-11-03); v1 to v4
# stay in the package unchanged, because the snapshots valued under them cite their hashes.
# v6: the edges and the Wide cap are derived (spec 2026-11-04 8.3); the user's settings overlay these defaults.
# v7: v6 with the growth routes' own sales-to-capital bound and the loss ramp bound (spec 2026-11-06 section 11)
# v8: v7 with the override ranges, the evidence rule, the secondary valuation's bounds and the stance words (spec 2026-11-06 Tier 2, section 19)
# v9: v8 with the override ranges of the cycle gap and the two NTM anchors, and the secondary valuation's driver ranges (spec 2026-11-06 Tier 2 as amended 2026-11-07, section 19)
# v10: v9 with the step-series gap, the split implied-count tolerance, and the override ranges of the outside value and the diluted count (spec 2026-11-09 section 11)
# v11: v10 with the inflation bound, the stale-rate bound and the rate history depth (spec 2026-11-10 section 9)
# v12: v11 with the cap on the return read on capital without goodwill and intangibles (method 4.6 rule 5; founder 2026-11-12)
# v13: v12 with the three stock-pay thresholds, the share-count band, the override range of the trailing stock pay, and the runway return's range widened to 500% (spec 2026-11-13 sections 7.1, 8, 10 and 14)
# v14: v13 with the override range of the minority interest (spec 2026-11-13 sections 13 and 14)
# v15: v14 with the multiple of the note sheet-shift (spec 2026-11-13 section 12.5)
# v16: v15 with the override ranges of the committed shares, the one-time item in the NTM consensus and the two revenue steps, and thin_revenue_step_max, the size above which a thin consensus revenue step is not read (spec 2026-11-14 sections 6.2 and 10)
# v17: v16 with one_time_items_share in nri_flag_share's place, and warning_mark_min (spec 2026-11-19 7.2, 7.4)
# v18: v17 without moat_wide_min, moat_narrow_min and refresh.gf_reuse_days (spec 2026-11-19 8.9)
#
# Each [values.<name>] table holds `value` and `source`. The source is the design.md section, the
# stocks mech/1.2 rule, the founder decision (research.md D<n>), the calibration, growth routes or
# 2026-11-03 spec section, the literature the number is taken from, or, where no literature gives
# the number, the words "no source". One table, [values.return_measure], is a recorded decision
# with a source and a note and no value.
# Policy.hash is the sha256 of this file's bytes, so any edit changes the hash every snapshot
# cites; a change of meaning needs a new version and file.

