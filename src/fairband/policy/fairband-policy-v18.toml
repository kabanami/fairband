[values.universe.value]
exchanges = ["NYSE", "NASDAQ", "AMEX"]
cap_floor_usd = 2e9
# Lower bounds in USD, largest first.
cap_bands = [[200e9, "Mega"], [10e9, "Large"], [2e9, "Mid"]]
# Every FMP industry string for banks, insurance and REITs, from FMP's available-industries
# vocabulary (checked 2026-10-31 against three published copies of that list), and Shell
# Companies, FMP's industry for SPACs, which design.md 2 excludes as listings that are not
# operating companies. The universe build compares them ignoring case and dash style, and also
# excludes an industry that starts with an entry and a space, so the bare Banks, Insurance and
# REIT entries cover a string the list does not name (Banks—Regional, Insurance Brokers).
excluded_industries = [
  "Banks",
  "Banks - Diversified",
  "Banks - Regional",
  "Insurance",
  "Insurance - Brokers",
  "Insurance - Diversified",
  "Insurance - Life",
  "Insurance - Property & Casualty",
  "Insurance - Reinsurance",
  "Insurance - Specialty",
  "REIT",
  "REIT - Diversified",
  "REIT - Healthcare Facilities",
  "REIT - Hotel & Motel",
  "REIT - Industrial",
  "REIT - Mortgage",
  "REIT - Office",
  "REIT - Residential",
  "REIT - Retail",
  "REIT - Specialty",
  "Shell Companies",
  # The industries FMP files lenders, insurers and investment banks under besides the names
  # above; the asset managers and brokers filed there go with them (design.md 6.1; decision
  # 2026-10-26; spec 2026-11-03 section 6.4). Financial - Data & Stock Exchanges stays admitted:
  # its companies are fee businesses with ordinary statements.
  "Asset Management",
  "Financial - Capital Markets",
  "Financial - Credit Services",
  "Financial - Mortgages",
  "Financial - Conglomerates",
  "Investment - Banking & Investment Services",
]
# Regular expressions for preferred shares, warrants, units and rights, in FMP's dash form
# (ACME-PA) and the exchange's dot form the screener rows come back in (XYZ-U becomes XYZ.U). A
# share class (BRK.B, BF.A) has another letter after its dot and passes.
symbol_exclude_patterns = ['[-.]P[A-Z]?$', '[-.]W[ST]?$', '[-.]U$', '[-.]R$']
# Regular expressions on the listing's name, matched ignoring case, for notes, debentures and
# preferred shares whose symbols carry no suffix (growth routes spec 5.17). ABXL, "... 8.875%
# Fixed Rate Senior Notes due 2028", is the known case; a rate may have a space before its percent
# sign ("5.25 % Debentures") or end the name ("... 5.625%"). Warrants, units and rights are caught
# by the symbol patterns; "units" is not listed because a partnership's name can carry "Common
# Units" or "Limited Partnership Units", nor "depositary", because an ADR's name can carry it.
name_exclude_patterns = [
  '\bnotes?\b',
  '\bdebentures?\b',
  '\bdue 20\d\d\b',
  '\d(\.\d+)? ?%(\s|$)',
  '\bpreferred\b',
  '\bpreference\b',
]
manual_exclusions = []
# Symbols admitted whatever their industry, in the exchange form: payment companies that do not
# lend; founder 2026-11-03 (spec 2026-11-03 section 6.4).
manual_admissions = ["V", "MA", "GPN"]

[values.refresh]
source = "research.md D13; spec 6.2; fmp_calls_per_minute: the founder's Ultimate plan, 3,000 a minute, less 5%, policy value (spec 2026-11-03 section 5.2); rate_limit_hold_s: one plan window, policy value (spec 2026-11-03 section 5.2); fx_history_years: spec 2026-11-10 sections 7.1 and 9, the trailing periods' ends lie within 15 months and three years leaves room; no source gives the number; policy value"

[values.refresh.value]
reuse_hours = 24
# 16 companies in flight, 31 FMP calls each, and one more for the newest earnings call's
# transcript where the store holds no copy of it with words. The worker count sets the
# concurrency only: the FMP limiter (fmp_calls_per_minute) paces the calls. A 429 after the
# retries ends the run, and the next run reuses what was fetched. Decided with the founder
# 2026-11-01; was 4 (stocks mech/1.2).
workers = 16
connect_timeout_s = 5
read_timeout_s = 15
deadline_s = 30
attempts = 3
backoff_s = [2, 4]
# Every FMP call waits for its slot in one pace the workers share; a 429 holds them all for the
# vendor's numeric Retry-After capped at rate_limit_hold_s seconds, else for rate_limit_hold_s
# (spec 2026-11-03 section 5.2).
fmp_calls_per_minute = 2850
rate_limit_hold_s = 60
# The years of daily closes a full or scoped refresh fetches for each currency's pair, USD<code>,
# back from today (spec 2026-11-10 section 7.1). Not a setting.
fx_history_years = 3

[values.override_ranges]
source = "spec 2026-11-06 Tier 2, section 10.2: the range of each numeric input an agent may override; no source gives the numbers; policy value"
note = "One pair [low, high] for each override tag, the ends included, in the unit the engine reads the input in: a fraction for a growth rate, a consensus step, a margin, a return or a decline rate (-0.20 is -20%), a multiple for sales-to-capital, dollars a share for the non-recurring gap, the cycle gap and the NTM EPS, dollars for the NTM revenue, debt and cash. A value outside its pair is refused-unit; so is a value at the lower end, 0, of the two NTM anchors' pairs, which an anchor must be above. The word tags, phase, moat.class and earnings.sbc_basis, take a word and have no pair. The upper end of 10^15 dollars stands for no bound: spec 10.2 gives the balance corrections 0 or more and the NTM revenue above 0. v9 adds the cycle gap's pair, the same range as the non-recurring gap's, and the two NTM anchors' pairs, earnings.ntm above 0 to 1,000 dollars a share and revenue.ntm above 0 (spec 10.2 as amended 2026-11-07). v10 adds the outside value's pair, value.outside -1,000 to 1,000 dollars a share, and the diluted count's, shares.diluted above 0 to 10^12 shares, its lower end 0 excluded as the NTM anchors' are (spec 2026-11-09 section 8). v13 adds the pair of the trailing stock pay, earnings.sbc 0 or more dollars, a total and not a figure a share, and widens the runway return's to above 0 to 5, 500%, so the input can take the engine's own measure; 5 still catches a percent typed as a whole number (spec 2026-11-13 sections 7.2, 10 and 14). v14 adds the pair of the minority interest, balance.minority 0 or more dollars, a total as debt and cash are (spec 2026-11-13, section 13). v16 adds the pair of the committed shares, shares.committed above 0 to 10^12 shares, its lower end 0 excluded as the diluted count's is, the pair of the one-time item in the NTM consensus, earnings.ntm_nri -100 to 100 dollars a share, and the pairs of the two revenue steps, revenue.step_2 and revenue.step_3 -0.80 to 3.00, as the consensus steps' (spec 2026-11-14, section 10)."

[values.override_ranges.value]
"growth.belief" = [-0.20, 0.60]
"path.hold" = [-0.20, 3.00]
"path.step_2" = [-0.80, 3.00]
"path.step_3" = [-0.80, 3.00]
"margin.target" = [-0.50, 0.60]
"capital.sales_to_capital" = [0.1, 10.0]
"return.runway" = [0.0, 5.0]
"earnings.nri_gap" = [-100.0, 100.0]
"earnings.cycle_gap" = [-100.0, 100.0]
"earnings.ntm" = [0.0, 1000.0]
"revenue.ntm" = [0.0, 1e15]
"decline.rate" = [-0.50, 0.0]
"balance.debt" = [0.0, 1e15]
"balance.cash" = [0.0, 1e15]
"value.outside" = [-1000.0, 1000.0]
"shares.diluted" = [0.0, 1e12]
"earnings.sbc" = [0.0, 1e15]
"balance.minority" = [0.0, 1e15]
"shares.committed" = [0.0, 1e12]
"earnings.ntm_nri" = [-100.0, 100.0]
"revenue.step_2" = [-0.80, 3.00]
"revenue.step_3" = [-0.80, 3.00]

