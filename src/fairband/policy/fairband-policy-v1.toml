# Fairband policy v1: every valuation constant the engine reads, each with its source line.
#
# Each [values.<name>] table holds `value` and `source`. The source is the design.md section, the
# stocks mech/1.2 rule, the founder decision (research.md D<n>), or, where no literature gives the
# number, the words "no source: policy value". Policy.hash is the sha256 of this file's bytes, so
# any edit changes the hash every snapshot cites; a change of meaning needs a new version and file.

[meta]
version = "fairband-policy-v1"

[values.required_return]
value = 0.09
source = "design.md 6.2 (stocks method v1.7 section 3): required return r = 9%"

[values.terminal_growth]
value = 0.03
source = "design.md 6.2 (stocks method v1.7 section 3): terminal growth gT = 3%"

[values.runway_years]
value = { None = 5, Narrow = 10, Wide = 20 }
source = "design.md 6.2 (stocks method v1.7 section 3): runway N in years by moat class"

[values.margin_of_safety]
value = { None = 0.45, Narrow = 0.35, Wide = 0.25 }
source = "design.md 6.2 (stocks method v1.7 Step 10): margin of safety by moat class"

[values.fair_band]
value = [0.85, 1.15]
source = "design.md 6.2 (stocks method v1.7 Step 10): fair band, times the value at belief"

[values.trim_multiple]
value = 1.5
source = "design.md 6.2 (stocks method v1.7 Step 10): trim level, times the value at belief"

[values.wide_terminal_roic_cap]
