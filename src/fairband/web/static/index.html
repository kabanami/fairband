    display: flex; flex-direction: column; gap: var(--space-2); min-width: 0;
    padding: var(--space-3) 14px 14px; background: var(--surface);
    border: 1px solid var(--hairline); border-radius: var(--radius-md);
  }
  .app-research__card .fb-report__prose, .app-research__card .fb-report__list {
    font-size: 14px; line-height: 20px;
  }
  .app-research__card .fb-report__table { width: 100%; }
  .app-research__card .fb-report__table :is(th, td):not(:first-child) { text-align: right; }
  /* A card keeps what it draws inside it, so the page never scrolls sideways (7.11): a
     sensitivity grid wider than its card, five columns at a narrow width, scrolls sideways in its
     card at every width. Price and multiples' column is a grid of cards at least 300px wide each,
     the price against the band across it, so the trailing and the forward P/E stand side by side
     under it where the column holds two and one under the other where it does not. */
  .app-research__chart .fb-sens { overflow-x: auto; }
  .app-research__cards--price {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
  }
  .app-research__cards--price > :first-child { grid-column: 1 / -1; }
  .app-research__head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 2px var(--space-3); margin: 0; color: var(--ink-muted);
  }
  .app-research__foot, .app-research__faint, .app-research__headnote { color: var(--ink-faint); }
  .app-research__foot { margin: 0; }
  .app-research__muted, .app-research__reason, .app-research__decision {
    margin: 0; color: var(--ink-muted);
  }
  .app-research__value { display: flex; flex-direction: column; gap: 2px; }
  .app-research__figure {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-2);
  }
  .app-research__kind { color: var(--ink-faint); }
  .app-research__levels {
    display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); margin: 0; padding: 0;
    list-style: none; color: var(--ink-muted);
  }
  .app-research__level { display: inline-flex; align-items: baseline; gap: 6px; }
  .app-research__level::before {
    content: ""; flex: none; align-self: center; width: 8px; height: 8px;
    border-radius: var(--radius-sm);
  }
  .app-research__level--buy::before { background: var(--zone-buy); }
  .app-research__level--fair::before { background: var(--zone-fair); }
  .app-research__level--trim::before { background: var(--zone-trim); }
  .app-research__recs {
    display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none;
  }
  .app-research__rec {
    display: flex; flex-direction: column; gap: 3px; padding: 9px 0;
    border-top: 1px solid var(--hairline);
  }
  .app-research__rec:first-child { padding-top: 0; border-top: 0; }
  .app-research__rec:last-child { padding-bottom: 0; }
  .app-research__rechead {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2);
  }
  .app-research__rec .app-research__label { font-weight: 500; }
  .app-research__effect { margin-left: auto; }
  .app-research__since, .app-research__host { color: var(--ink-faint); }
  .app-research__rec a {
    color: var(--ink); text-decoration-color: var(--border); text-underline-offset: 3px;
  }
  .app-research__rec a:hover { color: var(--accent); }
  .app-research__stamp {
    display: inline-flex; align-items: center; padding: 0 6px; color: var(--ink-muted);
    border: 1px solid currentColor; border-radius: var(--radius-sm); text-transform: uppercase;
    white-space: nowrap;
  }
  .app-research__stamp--on { color: var(--accent); }
  .app-research__judged {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: var(--space-3);
  }
  .app-research__judged .app-research__rechead { justify-content: space-between; }
  /* A paragraph beside its group's charts (7.4 rule 3), as the text beside its cards: a row that
     wraps, the paragraph keeping its width, 27rem at most, the charts at least 300px and taking
     the rest; side by side where the panel holds both, the charts under the paragraph across
     the panel where it cannot, the panel's own width deciding. */
  .app-research__pair {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-3) var(--space-8);
    padding-top: var(--space-5); border-top: 1px solid var(--hairline);
  }
  .app-research__pair > .app-research__run { flex: 0 1 27rem; }
  .app-research__pair > .app-research__minis { flex: 1 1 300px; }
  .app-research__body > .app-research__pair:first-child { padding-top: 0; border-top: 0; }
  /* The charts (7.9): the design system's charts need about 300px for their ticks, so a chart's
     track is never under 300px where its column allows it, and never wider than the column where
     it does not, at every width: three charts in a column too narrow for three stand two and
     one. A row of groups stands each group as a block of its own, side by side in their order and
     wrapping; a block is as wide as its charts at 320px a chart and the gaps between them
     (--charts, the count the tab sets), never wider than the row, so where it must shrink its
     charts wrap inside it. A block's title, a group's or By quarter over the earnings call's
     block, which stands across the panel, is in the label's look the report page gave a part. */
  .app-research__minis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
    gap: var(--space-3) var(--space-6); min-width: 0;
  }
  .app-research__minis > .app-report__error { grid-column: 1 / -1; margin: 0; }
  .app-research__groups {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-5) var(--space-6);
    min-width: 0;
  }
  .app-research__groups > .app-report__error { margin: 0; }
  .app-research__groups > .app-research__block {
    width: calc(var(--charts) * 320px + (var(--charts) - 1) * var(--space-6)); max-width: 100%;
  }
  .app-research__block { min-width: 0; }
  .app-research__part {
    margin: 0 0 var(--space-2); color: var(--ink-muted); text-transform: uppercase;
  }
  .app-research .fb-cite { color: inherit; border-bottom-color: var(--border); }
  .app-research .fb-cite:hover, .app-research .fb-cite:focus-visible {
    color: var(--accent); border-bottom-color: var(--accent);
  }
  .app-research .fb-cite:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: 2px;
  }
  .app-research .fb-report__prose .fb-cite, .app-research .fb-report__list .fb-cite {
    font-size: 0.875em; line-height: inherit;
  }
  .app-research .fb-report__table .fb-cite { border-bottom: 0; }
  .app-research .fb-cite__n { display: none; }
  .app-research--marks .fb-cite__n { display: inline; }
  .app-research__tip {
    position: fixed; z-index: 20; box-sizing: border-box; max-width: min(380px, calc(100vw - 24px));
    padding: 6px 10px; font-size: 12px; line-height: 17px; color: var(--ink);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-popover); pointer-events: none;
  }
  .app-research__tip[hidden] { display: none; }
  details.app-research__sec { padding: 0; }
  .app-research__summary {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-3);
    padding: 14px var(--space-6); list-style: none; border-radius: var(--radius-lg);
    cursor: pointer;
  }
  .app-research__summary::-webkit-details-marker { display: none; }
  .app-research__summary::before {
    content: "+"; width: 12px; font-family: var(--font-mono); color: var(--ink-faint);
  }
  details[open] > .app-research__summary::before { content: "−"; }
  .app-research__summary:hover { background: var(--surface-hover); }
  .app-research__summary:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: -2px;
  }
  .app-research__gloss { color: var(--ink-faint); }
  .app-research__fold { padding: var(--space-1) var(--space-6) var(--space-6); }
  .app-research__fold > .app-report__panel {
    margin: 0; padding: 0; background: none; border: 0; border-radius: 0;
  }
  .app-research__fold > .app-report__panel > h3 { display: none; }
  .app-research__fold .app-report__notes {
    max-width: none; columns: 2 22rem; column-gap: var(--space-10);
  }
  .app-research__fold .app-report__notes li { break-inside: avoid; }
  .app-research__fold .fb-rec + .fb-rec,
  .app-research__fold .app-report__entered + .fb-rec { margin-top: var(--space-3); }
  .app-research__records {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4);
    align-items: start;
  }
  .app-research__panel--full { grid-column: 1 / -1; }
  .app-research__panelhead {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 2px var(--space-3); margin: 0 0 14px;
  }
  .app-research__panelhead > .app-research__title { margin: 0; }
  .app-research__empty { margin: 0; color: var(--ink-faint); }
  .app-research__scroll { min-width: 0; overflow-x: auto; }
  .app-research__table { width: 100%; border-collapse: collapse; }
  .app-research__table th, .app-research__table td {
    padding: 7px var(--space-4) 7px 0; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--hairline);
  }
  .app-research__table :is(th, td):last-child { padding-right: 0; }
  .app-research__table thead th {
    vertical-align: bottom; color: var(--ink-muted); border-bottom-color: var(--border);
  }
  .app-research__table .fb-num { text-align: right; white-space: nowrap; }
  .app-research__when { color: var(--ink-muted); white-space: nowrap; }
  .app-research__table a {
    color: var(--ink); text-decoration-color: var(--border); text-underline-offset: 3px;
  }
  .app-research__table a:hover { color: var(--accent); }
  .app-research__review { cursor: pointer; }
  .app-research__review:hover { background: var(--surface-hover); }
  .app-research__review.is-open { background: var(--surface-selected); }
  .app-research__open {
    appearance: none; margin: 0; padding: 0; font: inherit; color: inherit; text-align: left;
    background: none; border: 0; cursor: pointer;
  }
  .app-research__open:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-research__bridge > td { padding: var(--space-3) 0 var(--space-4); }
  /* Below 980px the tab is one column (7.3, 7.4, 7.11), as the mockup has it: the section list a
     row above the report, each of its lists a line that scrolls sideways, the reports on file
     first, in a line under the bar, the name in view and the report shown marked by an accent
     lower edge; a pair's charts under its paragraph, one column, whatever the panel holds (a
     grid, so the row's flex sizes do not apply), as many to a row as the width holds, by the
     charts' rule at every width, whose tracks and blocks are never wider than their column, so
     nothing is wider than a 400px window; Records one column; the panels' padding 16px. A
     section's cards take no rule here: the panel's own width sets them beside the text or under
     it, at every width. */
  @media (width < 980px) {
    .app-research__records { grid-template-columns: minmax(0, 1fr); }
    .app-research__layout { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
    .app-research__list { position: static; max-height: none; gap: var(--space-2); }
    .app-research__group--files { order: -1; }
    .app-research__links, .app-research__files { flex-direction: row; overflow-x: auto; }
    .app-research__link, .app-research__file {
      width: auto; white-space: nowrap; border-left: 0; border-bottom: 2px solid var(--hairline);
    }
    .app-research__link.is-on, .app-research__file.is-on { border-bottom-color: var(--accent); }
    .app-research__pair { display: grid; grid-template-columns: minmax(0, 1fr); }
    .app-research__sec, .app-research__panel { padding: var(--space-4); }
    .app-research__summary { padding: var(--space-3) var(--space-4); }
    .app-research__fold { padding: var(--space-1) var(--space-4) var(--space-4); }
  }
  /* Printed, as save-as-PDF serves (spec 13.6): no header chrome, no status line, no button or
     menu, no Request research or its lines (plan 4); a panel another view would show is hidden
     already. The page runs its full length, not its window's. */
  @media print {
    #header, #controls, .fb-btn, .fb-menu, .app-dialog, .app-request, .app-requested,
    .app-request__error { display: none !important; }
    html, body, .app-page { height: auto; }
    .app-page { display: block; }
    /* the company page runs to its end: a browser does not break a scroll container across
       pages, so its panel is no scroll container in print, with no side padding */
    section#company { overflow: visible; padding: 0; }
    /* The Research tab (the Research tab's design, 7.11) prints the Report view alone: the
       company's name and ticker, the bar's line, every section and the three closed parts, which
       the tab's script opens before the page prints (company_research.js, openForPrint). Not the
       bar's controls or the section list; nor, where the tab is drawn, the head's price, today's,
       which moves with the latest snapshot while the report rests on its own, the head's
       controls or the tabs' row, a rule of its own so a browser that cannot read it still hides
       the tab's controls, and the other tabs print as they did. The report in one column, a
       section's cards under its text, a card and a chart whole on a page and a heading kept with
       what follows it. The footnote marks print whatever Footnote marks says: on paper no box
       shows a cite's source, so with the switch off, the default, the marks the screen hides
       print, and each number in the text points to its reference. */
    .app-research__views, .app-research__actions, .app-research__list { display: none !important; }
    .app-company:has(.app-research) :is(.app-company__quote, .app-company__actions,
    .app-company__tabs) { display: none !important; }
    .app-research__layout { display: block; }
    .app-research__split { display: grid; grid-template-columns: minmax(0, 1fr); }
    .app-research__cards { position: static; }
    .app-research__card, .app-charts__chart { break-inside: avoid; }
    .app-research h2, .app-research h3, .app-research h4,
    .app-research__summary { break-after: avoid; }
    .app-research:not(.app-research--marks) .fb-cite__n { display: inline; }
    /* the agent's table and a list item stay on one page (spec 2026-11-06 Tier 2, 18.4) */
    .fb-report__table, .fb-report__list li { break-inside: avoid; }
    /* the agent's table prints whole (spec 2026-11-15 9), as it did on the report page: its
       scroller does not clip it, and it takes the floor of the type scale, nothing below it,
       since a cite and its number never wrap and in a table dense with figures those pairs set
       its width: the cells' words at the label token's 12px on a 16px line, a cite at
       figure-sm's 12px, the size of its own class, on the cell's line, and its number at the
       caption's 11px, its screen size; the cells wrap as on screen, a cite still with its
       number. The type tokens are classes with no variables, so the sizes are written out; the
       tab's selector wins over the cell's type class. */
    .fb-report__scroll { overflow: visible; }
    .app-research .fb-report__table td { font-size: 12px; line-height: 16px; }
    .app-research .fb-report__table td .fb-cite { font-size: 12px; }
    /* The Investor relations tab (its design, 7.8) prints the view it shows alone, on either view
       without the tab's top row, its switch and the line of the next earnings report. Where the
       tab is drawn, the company's tab list, the head's price and its actions are left out too,
       and the row's caption, the data date, prints, at the row's right end: a printed call or
       filing list has no other date of its data. The Research tab's rule above, which leaves out
       its whole row, stays its own. On Earnings calls the call shown, its title, its figures and
       its whole transcript at its reading width, as on screen: wider than the column of an A4 or
       a Letter page upright, which it fills, and kept on a page turned sideways. Never faded; not
       the list of calls or the tools, whose buttons go with every button of the page. A
       paragraph whole on a page, a name and the questions' label kept with what follows them. */
    .app-company:has(.app-ir) :is(.app-company__quote, .app-company__actions,
    .app-company__tablist) { display: none !important; }
    .app-ir__bar { display: none !important; }
    .app-ir__list, .app-ir__tools { display: none !important; }
    .app-ir__calls { display: block; }
    .app-ir__reader[aria-busy="true"] { opacity: 1; }
    .app-ir__words { break-inside: avoid; }
    .app-ir__who, .app-ir__part { break-after: avoid; }
    /* On Filings the table as filtered, whole, its box not clipping it, under the line of the
       windows read, never faded; over it the filter pressed alone, as plain text with its count,
       so the paper says which filings it holds, and not the other four; Show older filings goes
       with every button of the page. A row whole on a page. */
    .app-ir__filter:not([aria-pressed="true"]) { display: none !important; }
    .app-ir__filter[aria-pressed="true"] {
      padding: 0; color: var(--ink); background: none; border: 0; border-radius: 0;
    }
    .app-ir__filings[aria-busy="true"] { opacity: 1; }
    .app-ir__scroll { overflow: visible; }
    .app-ir__table tr { break-inside: avoid; }
  }
