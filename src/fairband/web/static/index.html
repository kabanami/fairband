<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairband</title>
<link rel="icon" href="/static/design-system/assets/Logos/mark-on-dark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/design-system/fonts/fonts.css">
<link rel="stylesheet" href="/static/design-system/tokens/tokens.css">
<link rel="stylesheet" href="/static/design-system/components/bundle.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-sans); }
  /* The header runs edge to edge and does not stick: its hairline rule is the separation. What
     is under it keeps the page's margins. The table and the drawer each scroll in their own
     column, so the table's header stays put and the drawer stays beside whichever row opened
     it. Each other view scrolls as one panel. */
  .app-page { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; }
  #header { flex: none; }
  #controls { padding: var(--space-2) var(--space-6) 0; }
  #screen, #groups, #watchlists, #methodology, #settings, #inbox {
    flex: 1; min-height: 0; padding: 0 var(--space-6) var(--space-4);
  }
  #groups, #watchlists, #methodology, #settings, #inbox { overflow: auto; }

  /* The refresh controls, in the header's right slot beside the engine stamp. */
  .app-actions { display: flex; align-items: center; gap: var(--space-2); }
  /* At phone width the refresh controls stay beside the lockup, so the header grows by the
     views' line alone (B-82): below 560px the engine stamp gives way (the status line under the
     header still says when the last refresh ended), and below 400px the buttons read Prices and
     Full. Below 450px the six views, the Inbox count with them, wrap onto two lines rather than
     widen the page (spec 2026-11-06 Tier 2, 18.5). */
  .app-actions__short { display: none; }
  @media (width < 560px) {
    .fb-hdr__ran { display: none; }
  }
  @media (width < 400px) {
    .app-actions__long { display: none; }
    .app-actions__short { display: inline; }
  }
  @media (width < 450px) {
    .fb-hdr__nav { flex-wrap: wrap; height: auto; min-height: var(--header-height); row-gap: 0; }
    .fb-hdr__view { height: var(--header-height); }
  }
  /* The status line under the header, with the notice line under it when there is one. */
  .app-bar { margin-bottom: var(--space-3); }
  .app-status { margin: var(--space-2) 0 0; color: var(--ink-muted); }
  .app-status--caution { color: var(--caution); }
  /* The last refresh's line, with its Details ▾ beside it; the menu opens under the control,
     from its left edge, since the line starts at the page's left margin. */
  .app-statusline {
    display: flex; align-items: center; gap: var(--space-2); margin: var(--space-2) 0 0;
  }
  .app-statusline > .app-status { margin: 0; }
  .app-details .fb-menu { left: 0; right: auto; }
  .app-details__row {
    display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4);
    padding: 0 var(--space-1);
  }
  .app-details__row + .app-details__row { margin-top: var(--space-1); }
  /* A refresh is running: the old figures stay, at ink-faint, until the new ones land. No spinner,
     no motion. A phase number keeps its colour on its fill. The report page's tables are its
     appendixes, the records of the report's own snapshot, which no refresh changes: its own rule
     fades today's figures instead. */
  .is-recomputing:not(#report) .fb-table tbody td,
  .is-recomputing:not(#report) .fb-table tbody td *:not(.fb-phase__n) { color: var(--ink-faint); }

  .app-groups__bar { margin-bottom: var(--space-2); }
  .app-by { color: var(--ink-muted); }
  .app-select {
    margin-left: var(--space-2); padding: var(--space-1) var(--space-2); color: var(--ink);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .app-select:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-groups__table { width: auto; min-width: 50%; }
  .app-groups__note { margin: var(--space-2) 0 0; }
  .app-groups.is-loading .fb-table tbody td { color: var(--ink-faint); }
  .app-layout {
    position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr);
    gap: var(--space-4);
  }
  .app-layout--drawer { grid-template-columns: minmax(0, 1fr) var(--detail-rail); }
  /* No padding: a sticky child stops at the scroller's padding edge, so rows would show above
     the table's bar. The room FIND's focus ring needs at the top is the bar's own padding. */
  .app-main { min-height: 0; overflow: auto; }
  /* A table wider than the scroller scrolls sideways under its bar, which stays in view at no
     more than the scroller's width less its scrollbar (--scroller-width, which the page
     measures), so no row shows beside it. The screen grows with a table that cannot shrink to the
     scroller, for the bar to slide along; a table that can still takes the scroller's width. A
     cap, not a width: a width the scroller has just outgrown would hold the screen wide for a
     frame, and the scrollbar it brings and takes away again is a ResizeObserver loop. */
  .app-main .fb-screen { width: fit-content; min-width: 100%; }
  .app-main .fb-screen__bar { left: 0; max-width: var(--scroller-width, none); }
  /* Top, past one screen of the table: at the bottom right of the table's own grid cell (both
     lines named, since an absolute child's auto line is the grid's edge), over the table, so the
     drawer rail beside it never covers it. On the raised surface, as the bar and the header are,
     so a wide table's cells do not show through the quiet button. Above the table, below the
     bar (5) and so below its Filters and Columns menus in a short window. */
  .app-top {
    position: absolute; grid-area: 1 / 1 / 2 / 2; right: var(--space-4); bottom: var(--space-4);
    z-index: 4; background: var(--surface-raised);
  }
  .app-note { margin: 0; color: var(--ink-muted); }
  /* The watchlist popup (spec 2026-11-04 9.4): the bundle's menu, fixed where app.js places it
     under or over its mark, its lists short enough to fit either way; its last row the New
     watchlist field and Add, a refusal under them. */
  .app-watch { position: fixed; top: auto; right: auto; }
  .app-watch .fb-menu__body { max-height: min(368px, 30vh); }
  .app-watch__none { padding: 0 var(--space-1); }
  .app-watch__new { display: flex; align-items: center; gap: var(--space-2); }
  .app-watch__name {
    flex: 1; min-width: 0; padding: var(--space-1) var(--space-2); color: var(--ink);
    background: var(--surface-sunken); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-well);
  }
  .app-watch__name::placeholder { color: var(--ink-faint); }
  .app-watch__name:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-watch__error { margin: var(--space-2) 0 0; color: var(--caution); }
  /* The Watchlists view (spec 2026-11-04 9.6): the New watchlist field and Create above the
     lists; each list a section on the raised surface, its head the name, the count and the date,
     Rename and Delete; under it the Add a company field, its matches a column of buttons under
     it, then the list's table, which scrolls sideways on its own. No bar stands above a list's
     table, so its header cells keep the table's top; a company with no row has no name, and its
     Company cell shows an em dash as every other empty cell does. Delete's dialog stands over
     the page. */
  .app-lists { padding: var(--space-2) 0 var(--space-4); }
  .app-lists__new { display: flex; align-items: center; gap: var(--space-2); }
  .app-lists__empty { margin-top: var(--space-4); }
  .app-field {
    width: 16rem; max-width: 100%; box-sizing: border-box; padding: var(--space-1) var(--space-2);
    color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-well);
  }
  .app-field::placeholder { color: var(--ink-faint); }
  .app-field:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-lists__new .app-field { padding: var(--space-2) var(--space-3); }
  .app-wl {
    margin-top: var(--space-4); padding: var(--space-3) var(--space-4) var(--space-4);
    background: var(--surface-raised); border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
  }
  .app-wl__head {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  }
  .app-wl__title { margin: 0; overflow-wrap: anywhere; }
  .app-wl__meta { margin: 0; color: var(--ink-muted); }
  .app-wl__actions { display: flex; gap: var(--space-2); margin-left: auto; }
  .app-wl__error { margin: var(--space-2) 0 0; color: var(--caution); }
  .app-wl__add { margin-top: var(--space-3); }
  .app-wl__matches {
    list-style: none; width: 24rem; max-width: 100%; margin: var(--space-1) 0 0; padding: 0;
  }
  .app-wl__match {
    display: flex; align-items: baseline; gap: var(--space-3); width: 100%;
    padding: var(--space-1) var(--space-2); color: var(--ink); text-align: left;
    background: none; border: 0; border-radius: var(--radius-sm); cursor: pointer;
  }
  .app-wl__match:hover { background: var(--surface-hover); }
  .app-wl__match:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-wl__matchname {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .app-wl__hint, .app-wl__none { margin: var(--space-2) 0 0; }
  .app-wl__table { margin-top: var(--space-3); overflow-x: auto; }
  #watchlists .fb-screen { --bar-height: 0px; }
  #watchlists .fb-screen__name:empty::before { content: '—'; color: var(--ink-faint); }
  .app-dialog {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-start;
    justify-content: center; padding: 15vh var(--space-4) var(--space-4);
    background: color-mix(in srgb, var(--surface) 60%, transparent);
  }
  /* The Inbox view (spec 2026-11-06 Tier 2, 18.5): one table of the work items, the panel's
     width, its header cells not sticky. A note and the state word with a declined item's reason
     under it wrap rather than widen the table; only when even they cannot does the table scroll
     sideways on its own. An open item's last cell holds Decline; the reason line it opens spans
     the table under the row, the field, Decline and Cancel in a row, and a refused decline's
     sentence spans the line under that, in caution. Loading, the items shown stay, faded. */
  .app-inbox { padding: var(--space-2) 0 var(--space-4); }
  .app-inbox__scroll { overflow-x: auto; }
  .app-inbox .fb-table thead th { position: static; }
  .app-inbox .fb-table td { padding-top: var(--space-1); padding-bottom: var(--space-1); }
  .app-inbox .fb-table td.app-inbox__wrap {
    min-width: 14ch; white-space: normal; overflow-wrap: anywhere;
  }
  .app-inbox__why { display: block; color: var(--ink-muted); }
  .app-inbox__form { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .app-inbox__form .app-field { width: 24rem; }
  .app-inbox .fb-table td.app-inbox__error { white-space: normal; color: var(--caution); }
  .app-inbox.is-loading .fb-table tbody td { color: var(--ink-faint); }
  /* The Settings view (spec 2026-11-04 8.5): one form, its five groups each a heading over its
     rows. A row is the label and its captions at the left; at the right the fields, right-aligned
     and mono in the control style on surface-sunken, the word changed in accent and Reset beside
     them, the range and a refused save's sentence under them. The text keeps at least 16rem and
     the fields wrap; under 600px they go under the text. The notice leads the form; Reason and
     Save stay at the foot of the panel as it scrolls. */
  #settings { padding-bottom: 0; }
  .app-set { max-width: 64rem; padding: var(--space-2) 0 0; }
  .app-set__notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
    padding: var(--space-2) var(--space-3); background: var(--surface-raised);
    border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  }
  .app-set__notice p { margin: 0; }
  .app-set__started { color: var(--caution); }
  .app-set__head { margin: var(--space-6) 0 var(--space-2); }
  .app-set__row {
    display: grid; grid-template-columns: minmax(16rem, 1fr) auto;
    gap: var(--space-2) var(--space-6);
    padding: var(--space-3) 0; border-top: 1px solid var(--hairline);
  }
  .app-set__label { display: block; }
  .app-set__what { margin: var(--space-1) 0 0; color: var(--ink-muted); }
  .app-set__meta { margin: var(--space-1) 0 0; color: var(--ink-faint); overflow-wrap: anywhere; }
  .app-set__edit { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
  .app-set__fields {
    display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center;
    gap: var(--space-2);
  }
  .app-set__part { display: inline-flex; align-items: center; gap: var(--space-1); }
  .app-set__partname { color: var(--ink-muted); text-transform: uppercase; }
  .app-set__num { width: 5.5rem; font-family: var(--font-mono); text-align: right; }
  .app-set__list { width: 16rem; font-family: var(--font-mono); }
  .app-set__num[aria-invalid="true"], .app-set__list[aria-invalid="true"] {
    border-color: var(--caution);
  }
  .app-set__unit { color: var(--ink-muted); white-space: pre; }
  .app-set__end { min-width: 3.5rem; }
  .app-set__changed { color: var(--accent); }
  .app-set__check { display: inline-flex; align-items: center; gap: var(--space-1); }
  .app-set__check input { margin: 0; accent-color: var(--accent); }
  .app-set__check input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-set__range { margin: var(--space-1) 0 0; color: var(--ink-faint); text-align: right; }
  .app-set__range, .app-set__edit .app-set__error { max-width: 28rem; text-align: right; }
  .app-set__error { margin: var(--space-1) 0 0; color: var(--caution); }
  .app-set__save {
    position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--space-2) var(--space-3); margin-top: var(--space-4);
    padding: var(--space-3) 0 var(--space-4); background: var(--surface);
    border-top: 1px solid var(--hairline);
  }
  .app-set__saveerror { flex-basis: 100%; margin: 0; }
  .app-set__refused { margin: var(--space-2) 0 var(--space-3); color: var(--caution); }
  @media (width < 600px) {
    .app-set__row { grid-template-columns: minmax(0, 1fr); }
    .app-set__edit { align-items: flex-start; }
    .app-set__fields { justify-content: flex-start; }
    .app-set__range, .app-set__edit .app-set__error { text-align: left; }
  }
  /* The Methodology view (spec 2026-11-04 7): prose at a measure of about 70 characters, its
     headings in title and heading, its text in body, its tables in fb-table, their text cells
     free to wrap and their header cells not sticky, since many tables share one scroller; a
     table wider than the panel, at phone width, scrolls sideways on its own. The diagram takes
     up to its own 960 units and at least 800px, scrolling sideways in a narrower panel so its
     labels stay legible (B-82); under it, the plain list of the phases and their counts. Every live
     figure is mono with a dotted rule under it, in accent when it is a setting the reader
     changed. A link is in accent. */
  .app-prose { padding: var(--space-2) 0 var(--space-8); }
  .app-prose > section > p, .app-prose > section > ol, .app-prose > section > ul,
  .app-prose > section > h2, .app-prose > section > h3, .app-prose__wide,
  .app-prose > p, .app-prose .app-toc { max-width: 70ch; }
  .app-prose__wide { overflow-x: auto; }
  .app-prose h2 { margin: var(--space-8) 0 var(--space-3); }
  .app-prose > section:first-child > h2 { margin-top: var(--space-2); }
  .app-prose h3 { margin: var(--space-6) 0 var(--space-2); }
  .app-prose p { margin: 0 0 var(--space-3); }
  .app-prose ol, .app-prose ul { margin: 0 0 var(--space-3); padding-left: var(--space-6); }
  .app-prose li + li { margin-top: var(--space-1); }
  .app-prose a { color: var(--accent); }
  .app-prose a:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-prose .fb-table { width: 100%; margin: var(--space-2) 0 var(--space-3); }
  .app-prose .fb-table thead th { position: static; }
  .app-prose .fb-table td { white-space: normal; padding-top: var(--space-1);
    padding-bottom: var(--space-1); }
  .app-prose .fb-table td.fb-num { white-space: nowrap; }
  .app-prose .fb-table caption { padding-bottom: var(--space-1); text-align: left;
    color: var(--ink-muted); }
  .app-prose__note { color: var(--caution); }
  .app-prose__asof { color: var(--ink-muted); }
  .app-prose__row { margin-top: var(--space-2); }
  .app-prose span[data-policy], .app-prose span[data-count], .app-prose span[data-decile],
  .app-prose span[data-policy-version] {
    font-family: var(--font-mono); font-size: 0.92em;
    text-decoration: underline dotted var(--ink-faint); text-underline-offset: 3px;
  }
  .app-prose .is-changed { color: var(--accent); text-decoration-color: var(--accent); }
  .app-life { max-width: 960px; margin: var(--space-4) 0 var(--space-3); overflow-x: auto; }
  .app-life__svg { display: block; width: 100%; min-width: 800px; height: auto; }
  .app-prose .app-life__list {
    display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4);
    margin: var(--space-2) 0 0; padding: 0; list-style: none; color: var(--ink-muted);
  }
  .app-life__list li + li { margin-top: 0; }
  .app-toc ol { columns: 2 16rem; column-gap: var(--space-6); }
  .app-prose .app-phases { padding-left: 0; list-style: none; }
  .app-phases h3 { margin-top: var(--space-4); }
  .app-phases p { margin-bottom: var(--space-1); }
  .app-prose .app-flags { padding-left: 0; list-style: none; }
  .app-flags li + li { margin-top: var(--space-3); }
  .app-flags__what { display: block; margin-top: var(--space-1); }
  .app-link { color: var(--accent); }
  .app-link:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-more { margin: var(--space-2) 0 0; }
  /* A header that also drags keeps the bundle's grab cursor. */
  .fb-table thead th[tabindex]:not([draggable="true"]), .fb-table tbody tr[tabindex] {
    cursor: pointer;
  }
  .fb-table thead th[tabindex]:focus-visible, .fb-table tbody tr[tabindex]:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: -2px;
  }

  .app-drawer {
    min-height: 0; overflow-y: auto; background: var(--surface-raised);
    border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  }
  .app-drawer__bar {
    position: sticky; top: 0; z-index: 4; display: flex; justify-content: flex-end;
    padding: var(--space-1) var(--space-2); background: var(--surface-raised);
    border-bottom: 1px solid var(--hairline);
  }
  .app-drawer__body { padding: var(--space-3) var(--space-4) var(--space-6); }
  /* Loading: the previous company, faded, until the new one lands. No spinner, no motion. */
  .app-drawer__body.is-loading { opacity: 0.5; }
  .app-drawer__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .app-drawer__ticker { margin: 0; }
  .app-drawer__name { margin: 0; flex-basis: 100%; color: var(--ink-muted); }
  .app-drawer__brief, .app-drawer__currency { margin: 0; flex-basis: 100%; }
  .app-section { margin: var(--space-6) 0 0; }
  .app-section > h3 { margin: 0 0 var(--space-2); }
  .app-pairs {
    display: grid; grid-template-columns: max-content minmax(0, 1fr);
    gap: var(--space-1) var(--space-3); margin: 0; align-items: baseline;
  }
  .app-pairs dt { color: var(--ink-muted); }
  .app-pairs dd { margin: 0; overflow-wrap: anywhere; }
  /* The levels under the band meter, clear of its caption. */
  .app-levels { margin-top: var(--space-3); }
  .app-group + .app-group { margin-top: var(--space-3); }
  .app-group__head { margin: 0 0 var(--space-1); color: var(--ink-muted); }
  .app-list { list-style: none; margin: 0; padding: 0; }
  .app-list li + li { margin-top: var(--space-2); }
  .app-list p { margin: 0; }
  /* Piotroski's signals, a line each, each led by met, not met or not read in a box as wide as
     the longest, so the signals' names line up, a name that wraps included. */
  .app-signals { margin-top: var(--space-2); }
  .app-signals li { display: flex; align-items: baseline; }
  .app-signals li + li { margin-top: 0; }
  .app-mark { flex: none; min-width: 8ch; }
  .app-inputs th, .app-inputs td { padding: var(--space-2) var(--space-1); }
  .app-inputs td { vertical-align: top; white-space: normal; overflow-wrap: anywhere; }
  .app-inputs td.fb-num { white-space: nowrap; }
  /* A table of figures wider than the rail, the growth route's ten years, scrolls sideways on its
     own; the drawer does not. */
  .app-scroll { overflow-x: auto; }
  .app-scroll:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-scroll + .app-pairs { margin-top: var(--space-2); }
  .app-figures th, .app-figures td { padding: 0 var(--space-2); }
  /* The first column, the year or the peer, stays in view while the table scrolls sideways; on
     the drawer's surface, above the header cells that scroll under it. */
  .app-figures th:first-child, .app-figures td:first-child {
    position: sticky; left: 0; background: var(--surface-raised);
  }
  .app-figures th:first-child { z-index: 1; }
  .app-line { display: block; }
  .app-nowrap { white-space: nowrap; }
  .app-muted { color: var(--ink-faint); }
  .app-refusal { margin: 0; color: var(--caution); }
  /* What the price needs (method 4.11), the lead of a band whose price is well above its value. */
  .app-needs { margin: 0 0 var(--space-3); max-width: 60ch; }
  /* The drawer's main view (spec 2026-11-06 Tier 2, 18.2): the stance line, the report's word as
     the row's chip with who published it, close over the Summary; Open the report under it.
     Request research's menu opens under its button from the button's left edge, the menu's note
     line as wide as the menu; the server's refusal and the open item's line follow the button.
     Details ▾ closes the main view. */
  .app-stance {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
    margin: var(--space-6) 0 0;
  }
  .app-stance + .app-section { margin-top: var(--space-3); }
  .app-open { margin: var(--space-3) 0 0; }
  .app-request { position: relative; display: inline-block; }
  .app-request .fb-menu { left: 0; right: auto; }
  .app-request__line { display: block; }
  .app-request__line .app-field { width: 100%; }
  .app-request__error { margin: var(--space-2) 0 0; color: var(--caution); }
  .app-requested { margin: var(--space-2) 0 0; color: var(--ink-muted); }
  .app-disclosure { margin-left: calc(-1 * var(--space-2)); }
  /* Details (18.3): the overrides one record under another; a chip on a line of its own under the
     text it signs; a note's text as written, its lines kept; Add a note's field the rail's width,
     a refusal under it; a source or a ref wraps anywhere rather than widen the rail. */
  .app-drawer .fb-rec + .fb-rec { margin-top: var(--space-3); }
  .app-secondary__path { margin-top: var(--space-2); }
  .app-chipline { margin: var(--space-1) 0 0; }
  .app-notes__text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .app-notes__new {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2);
    margin-top: var(--space-3);
  }
  .app-notes__field { width: 100%; resize: vertical; font-family: var(--font-sans); }
  .app-notes__error { margin: var(--space-2) 0 0; color: var(--caution); }
  .app-source { overflow-wrap: anywhere; }
  /* The report page (spec 2026-11-06 Tier 2, 18.4), in CompanyReport's order, one column: the
     head, the ticker, the name and the phase badge, then the one headline figure with the price
     beside it; the meter under it, at the width it reads best, a refusal under it; the meta line
     above the reader, its two buttons at its end, the other revisions under it; the reader; then
     the references, Appendix A and Appendix B, each a panel on the raised surface with a hairline
     border and no shadow, space-8 apart. Loading, the page keeps what it had, faded. */
  #report { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--space-6) var(--space-4); }
  .app-report { max-width: 72rem; padding: var(--space-2) 0 var(--space-8); }
  .app-report.is-loading { opacity: 0.5; }
  /* While a refresh runs, today's figures, the head's and the meter, are held at reduced opacity
     until the page reads the company again as the run ends (CompanyReport.md); the report and its
     appendixes rest on their own snapshot and stay as they are. */
  .is-recomputing .app-report__figures, .is-recomputing .app-report__band { opacity: 0.5; }
  .app-report__head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: var(--space-2) var(--space-6);
  }
  .app-report__id, .app-report__figures {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3);
  }
  .app-report__ticker, .app-report__name { margin: 0; }
  .app-report__name { color: var(--ink-muted); }
  .app-report__currency { margin: 0; flex-basis: 100%; }
  .app-report__brief { max-width: 72ch; margin: var(--space-3) 0 0; }
  .app-report__band { max-width: 40rem; margin-top: var(--space-4); }
  .app-report__band .app-refusal { margin-top: var(--space-3); }
  .app-report__meta { margin-top: var(--space-8); }
  .app-report__line {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  }
  .app-report__mode { color: var(--ink-muted); text-transform: uppercase; }
  .app-report__actions { display: flex; gap: var(--space-2); margin-left: auto; }
  .app-report__revisions, .app-report__note { margin: var(--space-2) 0 0; color: var(--ink-muted); }
  .app-report__error { margin: var(--space-2) 0 0; color: var(--caution); }
  .app-report__meta .app-request { margin-top: var(--space-2); }
  .app-report .fb-report { margin-top: var(--space-3); }
  .app-report__panel {
    margin-top: var(--space-8); padding: var(--space-3) var(--space-4) var(--space-4);
    background: var(--surface-raised); border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
  }
  .app-report__panel > h3 { margin: 0 0 var(--space-3); }
  .app-report__notes { max-width: 72ch; margin: 0; padding: 0; list-style: none; }
  .app-report__notes li { overflow-wrap: anywhere; }
  .app-report__notes li + li { margin-top: var(--space-1); }
  .app-report__n { color: var(--ink-faint); }
  .app-report__part + .app-report__part { margin-top: var(--space-6); }
  .app-report__part > h4 { margin: 0 0 var(--space-2); }
  .app-report__part > p { max-width: 72ch; margin: 0; overflow-wrap: anywhere; }
  .app-report__part > p + * { margin-top: var(--space-2); }
  .app-report .fb-rec + .fb-rec { margin-top: var(--space-3); }
  /* The words of an override's scaling at a split, under its record (spec 2026-11-15 8). */
  .app-report__part > .app-report__entered { margin-top: var(--space-1); color: var(--ink-muted); }
  .app-report .app-report__entered + .fb-rec { margin-top: var(--space-3); }
  .app-report__glossary { max-width: 72ch; margin: 0; }
  .app-report__glossary dd { margin: var(--space-1) 0 var(--space-3); }
  .app-report__none { margin-top: var(--space-6); }
  .app-report__none > .app-note { margin-bottom: var(--space-3); }
  .app-report__back { margin: var(--space-8) 0 0; }
  /* The report's charts (spec 18.4, CompanyReport.md): inside the reader, under a section's
     heading and above its sentences, each on a raised panel with a hairline border and no shadow,
     two to a row as small multiples, one to a row below 840px; the price against the band the
     full width. A part of section 4 under its table's title. */
  .app-charts {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3);
    margin: var(--space-2) 0 var(--space-4);
  }
  .app-chart {
    min-width: 0; padding: var(--space-3) var(--space-4);
    background: var(--surface-raised); border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
  }
  .app-chart--wide { grid-column: 1 / -1; }
  .app-charts__part {
    margin: var(--space-4) 0 0; color: var(--ink-muted); text-transform: uppercase;
  }
  .app-charts__part:first-child { margin-top: var(--space-2); }
  .app-chart .app-report__error { margin: 0; }
  .app-chart .fb-c + .app-report__error { margin-top: var(--space-2); }
  .fb-report__section > .app-report__error { margin: var(--space-1) 0 var(--space-3); }
  @media (width < 840px) { .app-charts { grid-template-columns: minmax(0, 1fr); } }
  /* Printed, as save-as-PDF serves (spec 13.6, 18.4): the report page's name and meta line, the
     reader, the references and the appendixes. No header chrome, no status line, no button or
     menu, no Request research or its lines (plan 4), and not today's figures, the headline, the
     price and the meter, which move with the latest snapshot while the report rests on its own; a
     panel another view would show is hidden already. The page runs its full length, not its
     window's. */
  @media print {
    #header, #controls, .fb-btn, .fb-menu, .app-dialog, .app-report__figures, .app-report__band,
    .app-report__revisions, .app-report__back, .app-request, .app-requested,
    .app-request__error { display: none !important; }
    html, body, .app-page { height: auto; }
    .app-page { display: block; }
    section#report { overflow: visible; padding: 0; }
    .app-report { max-width: none; padding: 0; }
    .app-report h3, .app-report h4 { break-after: avoid; }
    .app-chart { break-inside: avoid; }
    /* the agent's table and a list item stay on one page (spec 2026-11-06 Tier 2, 18.4) */
    .fb-report__table, .fb-report__list li { break-inside: avoid; }
    /* the agent's table prints whole (spec 2026-11-15 9): neither its scroller nor the reader's
       card clips it; its body at the body token's 14px on a 20px line, the size the cell's class
       names, a cite and its number at their screen sizes; its cells wrap as on screen, a cite
       still with its number */
    .fb-report__scroll { overflow: visible; }
    .fb-report { overflow: visible; }
    .fb-report .fb-report__table td { font-size: 14px; line-height: 20px; }
  }
</style>
