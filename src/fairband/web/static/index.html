<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairband</title>
<link rel="icon" href="/static/design-system/assets/Logos/mark-on-dark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/design-system/fonts/fonts.css">
<link rel="stylesheet" href="/static/design-system/tokens/tokens.css">
<link rel="stylesheet" href="/static/design-system/components/bundle.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-sans); }
  /* The header runs edge to edge and does not stick: its hairline rule is the separation. What
     is under it keeps the page's margins. The table and the drawer each scroll in their own
     column, so the table's header stays put and the drawer stays beside whichever row opened
     it. Each other view scrolls as one panel, but the watchlist page: its head is a panel of its
     own height, and the Screen's panel, which holds the table and the drawer, fills the rest
     under it (spec 2026-11-22). */
  .app-page { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; }
  #header { flex: none; }
  #controls { padding: var(--space-2) var(--space-6) 0; }
  #screen, #groups, #methodology, #settings, #inbox {
    flex: 1; min-height: 0; padding: 0 var(--space-6) var(--space-4);
  }
  #groups, #methodology, #settings, #inbox { overflow: auto; }
  #watchlists { flex: none; padding: var(--space-2) var(--space-6); }

  /* The header's finder (finder.js), first in the header's right slot on every view but the
     Screen: a field in the look of the Screen's own, 220px wide, that alone gives way, down to
     96px, where the one-line header is tight (the refresh controls keep their words on one
     line), and is not drawn under 1100px of window, where the header has no room for it beside
     the six views, the refresh controls and the stamp; its list in the bundle's menu frame,
     under the field's left edge, as wide as its longest row to 420px, a row's name cut with an
     ellipsis; the marked row and the row under the pointer on surface-hover. */
  .app-finder { position: relative; flex: 0 1 auto; width: 220px; min-width: 96px; }
  .fb-hdr__right { min-width: 0; } /* the slot may shrink, and in it the finder alone gives way */
  @media (width < 1100px) {
    .app-finder { display: none; }
  }
  .app-finder__q {
    box-sizing: border-box; width: 100%; padding: var(--space-1) var(--space-2);
    font-family: var(--font-mono); font-size: 13px; line-height: 16px; color: var(--ink);
    background: var(--surface-sunken); border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .app-finder__q::placeholder { color: var(--ink-faint); font-family: var(--font-sans); }
  .app-finder__q:focus { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .app-finder__list {
    left: 0; right: auto; box-sizing: border-box; min-width: 100%; width: max-content;
    max-width: min(420px, calc(100vw - 2 * var(--space-6))); margin: 0; padding: var(--space-1);
    list-style: none;
  }
  .app-finder__opt {
    display: flex; align-items: baseline; gap: var(--space-2); padding: 3px var(--space-2);
    border-radius: var(--radius-sm); cursor: pointer;
  }
  .app-finder__opt[aria-selected="true"], .app-finder__opt:hover {
    background: var(--surface-hover);
  }
  .app-finder__name {
    min-width: 0; overflow: hidden; color: var(--ink-muted); text-overflow: ellipsis;
    white-space: nowrap;
  }
  .app-finder__none { padding: 3px var(--space-2); color: var(--ink-faint); }
  /* The refresh controls, in the header's right slot beside the engine stamp. */
  .app-actions { display: flex; flex: none; align-items: center; gap: var(--space-2); }
  /* At phone width the refresh controls stay beside the lockup, so the header grows by the
     views' line alone (B-82): below 560px the engine stamp gives way (the status line under the
     header still says when the last refresh ended, on the views that draw it: a page of one
     company draws it only for a run that did not end done), and below 400px the buttons read
     Prices and Full. Below 450px the six views, the Inbox count with them, wrap onto two lines
     rather than widen the page (spec 2026-11-06 Tier 2, 18.5). */
  .app-actions__short { display: none; }
  @media (width < 560px) {
    .fb-hdr__ran { display: none; }
  }
  @media (width < 400px) {
    .app-actions__long { display: none; }
    .app-actions__short { display: inline; }
  }
  @media (width < 450px) {
    .fb-hdr__nav { flex-wrap: wrap; height: auto; min-height: var(--header-height); row-gap: 0; }
    .fb-hdr__view { height: var(--header-height); }
  }
  /* The status line under the header, with the notice line under it when there is one. A bar
     that draws nothing, on a page of one company with no run and no notice, takes no room. */
  .app-bar { margin-bottom: var(--space-3); }
  .app-status { margin: var(--space-2) 0 0; color: var(--ink-muted); }
  .app-bar--bare { margin: 0; }
  .app-bar--bare .app-status { margin: 0; }
  .app-status--caution { color: var(--caution); }
  /* The last refresh's line, with its Details ▾ beside it; the menu opens under the control,
     from its left edge, since the line starts at the page's left margin. */
  .app-statusline {
    display: flex; align-items: center; gap: var(--space-2); margin: var(--space-2) 0 0;
  }
  .app-statusline > .app-status { margin: 0; }
  .app-details .fb-menu { left: 0; right: auto; }
  .app-details__row {
    display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4);
    padding: 0 var(--space-1);
  }
  .app-details__row + .app-details__row { margin-top: var(--space-1); }
  /* A refresh is running: the old figures stay, at ink-faint, until the new ones land. No spinner,
     no motion. A phase number keeps its colour on its fill. The Research tab's tables are a
     report's appendixes, the records of the report's own snapshot, which no refresh changes: they
     stay as they are. */
  .is-recomputing .fb-table:not(.app-research .fb-table) tbody td,
  .is-recomputing .fb-table:not(.app-research .fb-table) tbody td *:not(.fb-phase__n) {
    color: var(--ink-faint);
  }

  .app-groups__bar { margin-bottom: var(--space-2); }
  .app-by { color: var(--ink-muted); }
  .app-select {
    margin-left: var(--space-2); padding: var(--space-1) var(--space-2); color: var(--ink);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .app-select:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-groups__table { width: auto; min-width: 50%; }
  .app-groups__note { margin: var(--space-2) 0 0; }
  .app-groups.is-loading .fb-table tbody td { color: var(--ink-faint); }
  .app-layout {
    position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr);
    gap: var(--space-4);
  }
  .app-layout--drawer { grid-template-columns: minmax(0, 1fr) var(--detail-rail); }
  /* No padding: a sticky child stops at the scroller's padding edge, so rows would show above
     the table's bar. The room FIND's focus ring needs at the top is the bar's own padding. */
  .app-main { min-height: 0; overflow: auto; }
  /* A table wider than the scroller scrolls sideways under its bar, which stays in view at no
     more than the scroller's width less its scrollbar (--scroller-width, which the page
     measures), so no row shows beside it. The screen grows with a table that cannot shrink to the
     scroller, for the bar to slide along; a table that can still takes the scroller's width. A
     cap, not a width: a width the scroller has just outgrown would hold the screen wide for a
     frame, and the scrollbar it brings and takes away again is a ResizeObserver loop. */
  .app-main .fb-screen { width: fit-content; min-width: 100%; }
  .app-main .fb-screen__bar { left: 0; max-width: var(--scroller-width, none); }
  /* The ticker's link to the company page in the screen's table and a watchlist's (the company
     page's design, 12): it reads as the ticker the cell draws, an underline on hover and the
     focus ring on focus. */
  .fb-screen__company { color: inherit; text-decoration: none; }
  .fb-screen__company:hover { text-decoration: underline; }
  .fb-screen__company:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  /* Top, past one screen of the table: at the bottom right of the table's own grid cell (both
     lines named, since an absolute child's auto line is the grid's edge), over the table, so the
     drawer rail beside it never covers it. On the raised surface, as the bar and the header are,
     so a wide table's cells do not show through the quiet button. Above the table, below the
     bar (5) and so below its Filters and Columns menus in a short window. */
  .app-top {
    position: absolute; grid-area: 1 / 1 / 2 / 2; right: var(--space-4); bottom: var(--space-4);
    z-index: 4; background: var(--surface-raised);
  }
  .app-note { margin: 0; color: var(--ink-muted); }
  /* The watchlist popup (spec 2026-11-04 9.4): the bundle's menu, fixed where app.js places it
     under or over its mark, its lists short enough to fit either way; its last row the New
     watchlist field and Add, a refusal under them. */
  .app-watch { position: fixed; top: auto; right: auto; }
  .app-watch .fb-menu__body { max-height: min(368px, 30vh); }
  .app-watch__none { padding: 0 var(--space-1); }
  .app-watch__new { display: flex; align-items: center; gap: var(--space-2); }
  .app-watch__name {
    flex: 1; min-width: 0; padding: var(--space-1) var(--space-2); color: var(--ink);
    background: var(--surface-sunken); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-well);
  }
  .app-watch__name::placeholder { color: var(--ink-faint); }
  .app-watch__name:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-watch__error { margin: var(--space-2) 0 0; color: var(--caution); }
  /* The watchlist page's head (spec 2026-11-22 7.3 and 7.4), above the Screen's table and drawer,
     which draw the list: one row that wraps in a narrow window, the selector, the list's count and
     the day it was made, Set as default, Rename and Delete, then the New watchlist field and
     Create at the row's end; a refused write's sentence under it, then the Add a company field,
     its matches a column of buttons under it. With no list, the row is New watchlist and Create
     at its start, and the sentence under it says how to make one. A company with no row has no
     name, and its Company cell shows an em dash as every other empty cell does. Delete's dialog
     stands over the page. */
  .app-lists__row {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-6);
  }
  .app-lists__new { display: flex; align-items: center; gap: var(--space-2); }
  .app-wl__head ~ .app-lists__new { margin-left: auto; }
  .app-lists__empty { margin-top: var(--space-2); }
  .app-field {
    width: 16rem; max-width: 100%; box-sizing: border-box; padding: var(--space-1) var(--space-2);
    color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-well);
  }
  .app-field::placeholder { color: var(--ink-faint); }
  .app-field:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-wl__head {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  }
  .app-wl__pick { max-width: 20rem; margin-left: 0; }
  .app-wl__meta { margin: 0; color: var(--ink-muted); }
  .app-wl__actions { display: flex; gap: var(--space-2); }
  .app-wl__error { margin: var(--space-2) 0 0; color: var(--caution); }
  .app-wl__add { margin-top: var(--space-2); }
  .app-wl__matches {
    list-style: none; width: 24rem; max-width: 100%; margin: var(--space-1) 0 0; padding: 0;
  }
  .app-wl__match {
    display: flex; align-items: baseline; gap: var(--space-3); width: 100%;
    padding: var(--space-1) var(--space-2); color: var(--ink); text-align: left;
    background: none; border: 0; border-radius: var(--radius-sm); cursor: pointer;
  }
  .app-wl__match:hover { background: var(--surface-hover); }
  .app-wl__match:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-wl__matchname {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .app-wl__hint { margin: var(--space-2) 0 0; }
  #screen .fb-screen__name:empty::before { content: '—'; color: var(--ink-faint); }
  .app-dialog {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-start;
    justify-content: center; padding: 15vh var(--space-4) var(--space-4);
    background: color-mix(in srgb, var(--surface) 60%, transparent);
  }
  /* The Inbox view (spec 2026-11-06 Tier 2, 18.5): one table of the work items, the panel's
     width, its header cells not sticky. A note and the state word with a declined item's reason
     under it wrap rather than widen the table; only when even they cannot does the table scroll
     sideways on its own. An open item's last cell holds Decline; the reason line it opens spans
     the table under the row, the field, Decline and Cancel in a row, and a refused decline's
     sentence spans the line under that, in caution. Loading, the items shown stay, faded. */
  .app-inbox { padding: var(--space-2) 0 var(--space-4); }
  .app-inbox__scroll { overflow-x: auto; }
  .app-inbox .fb-table thead th { position: static; }
  .app-inbox .fb-table td { padding-top: var(--space-1); padding-bottom: var(--space-1); }
  .app-inbox .fb-table td.app-inbox__wrap {
    min-width: 14ch; white-space: normal; overflow-wrap: anywhere;
  }
  .app-inbox__why { display: block; color: var(--ink-muted); }
  .app-inbox__failed { color: var(--caution); }
  .app-inbox__open { margin-right: var(--space-2); }
  .app-inbox__form { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .app-inbox__form .app-field { width: 24rem; }
  .app-inbox .fb-table td.app-inbox__error { white-space: normal; color: var(--caution); }
  .app-inbox.is-loading .fb-table tbody td { color: var(--ink-faint); }
  /* The Settings view (spec 2026-11-04 8.5): one form, its five groups each a heading over its
     rows. A row is the label and its captions at the left; at the right the fields, right-aligned
     and mono in the control style on surface-sunken, the word changed in accent and Reset beside
     them, the range and a refused save's sentence under them. The text keeps at least 16rem and
     the fields wrap; under 600px they go under the text. The notice leads the form; Reason and
     Save stay at the foot of the panel as it scrolls. */
  #settings { padding-bottom: 0; }
  .app-set { max-width: 64rem; padding: var(--space-2) 0 0; }
  .app-set__notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
    padding: var(--space-2) var(--space-3); background: var(--surface-raised);
    border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  }
  .app-set__notice p { margin: 0; }
  .app-set__started { color: var(--caution); }
  .app-set__head { margin: var(--space-6) 0 var(--space-2); }
  .app-set__row {
    display: grid; grid-template-columns: minmax(16rem, 1fr) auto;
    gap: var(--space-2) var(--space-6);
    padding: var(--space-3) 0; border-top: 1px solid var(--hairline);
  }
  .app-set__label { display: block; }
  .app-set__what { margin: var(--space-1) 0 0; color: var(--ink-muted); }
  .app-set__meta { margin: var(--space-1) 0 0; color: var(--ink-faint); overflow-wrap: anywhere; }
  .app-set__edit { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
  .app-set__fields {
    display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center;
    gap: var(--space-2);
  }
  .app-set__part { display: inline-flex; align-items: center; gap: var(--space-1); }
  .app-set__partname { color: var(--ink-muted); text-transform: uppercase; }
  .app-set__num { width: 5.5rem; font-family: var(--font-mono); text-align: right; }
  .app-set__list { width: 16rem; font-family: var(--font-mono); }
  .app-set__num[aria-invalid="true"], .app-set__list[aria-invalid="true"] {
    border-color: var(--caution);
  }
  .app-set__unit { color: var(--ink-muted); white-space: pre; }
  .app-set__end { min-width: 3.5rem; }
  .app-set__changed { color: var(--accent); }
  .app-set__check { display: inline-flex; align-items: center; gap: var(--space-1); }
  .app-set__check input { margin: 0; accent-color: var(--accent); }
  .app-set__check input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-set__range { margin: var(--space-1) 0 0; color: var(--ink-faint); text-align: right; }
  .app-set__range, .app-set__edit .app-set__error { max-width: 28rem; text-align: right; }
  .app-set__error { margin: var(--space-1) 0 0; color: var(--caution); }
  .app-set__save {
    position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--space-2) var(--space-3); margin-top: var(--space-4);
    padding: var(--space-3) 0 var(--space-4); background: var(--surface);
    border-top: 1px solid var(--hairline);
  }
  .app-set__saveerror { flex-basis: 100%; margin: 0; }
  .app-set__refused { margin: var(--space-2) 0 var(--space-3); color: var(--caution); }
  @media (width < 600px) {
    .app-set__row { grid-template-columns: minmax(0, 1fr); }
    .app-set__edit { align-items: flex-start; }
    .app-set__fields { justify-content: flex-start; }
    .app-set__range, .app-set__edit .app-set__error { text-align: left; }
  }
  /* The Agents section (spec 2026-11-16 agent launch, 7.3), after the valuation settings: its
     rows laid out as theirs; a text field in mono, wide enough for the window command's one line
     where the row has room and as wide as its column where it has not, so it never lays over the
     label at its left (the row's fields take the whole column, and the field may narrow below its
     32rem); a choice at the field's own width, each bordered in caution under a refused save's
     sentence; Use the Windows Terminal line under the window command's field; Save and Test in a
     row at the section's foot, a refused save's sentence and the test's line each a line under
     them. */
  .app-agents { padding-bottom: var(--space-4); }
  .app-agents .app-set__fields { align-self: stretch; }
  .app-agents__text { width: 32rem; min-width: 0; font-family: var(--font-mono); }
  .app-agents__text[aria-invalid="true"], .app-agents__choice[aria-invalid="true"] {
    border-color: var(--caution);
  }
  .app-agents__suggest { margin-top: var(--space-2); }
  .app-agents__actions {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
    padding-top: var(--space-3); border-top: 1px solid var(--hairline);
  }
  .app-agents__line { flex-basis: 100%; margin: 0; }
  /* The Methodology view (spec 2026-11-04 7): prose at a measure of about 70 characters, its
     headings in title and heading, its text in body, its tables in fb-table, their text cells
     free to wrap and their header cells not sticky, since many tables share one scroller; a
     table wider than the panel, at phone width, scrolls sideways on its own. The diagram takes
     up to its own 960 units and at least 800px, scrolling sideways in a narrower panel so its
     labels stay legible (B-82); under it, the plain list of the phases and their counts. Every live
     figure is mono with a dotted rule under it, in accent when it is a setting the reader
     changed. A link is in accent. */
  .app-prose { padding: var(--space-2) 0 var(--space-8); }
  .app-prose > section > p, .app-prose > section > ol, .app-prose > section > ul,
  .app-prose > section > h2, .app-prose > section > h3, .app-prose__wide,
  .app-prose > p, .app-prose .app-toc { max-width: 70ch; }
  .app-prose__wide { overflow-x: auto; }
  .app-prose h2 { margin: var(--space-8) 0 var(--space-3); }
  .app-prose > section:first-child > h2 { margin-top: var(--space-2); }
  .app-prose h3 { margin: var(--space-6) 0 var(--space-2); }
  .app-prose p { margin: 0 0 var(--space-3); }
  .app-prose ol, .app-prose ul { margin: 0 0 var(--space-3); padding-left: var(--space-6); }
  .app-prose li + li { margin-top: var(--space-1); }
  .app-prose a { color: var(--accent); }
  .app-prose a:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-prose .fb-table { width: 100%; margin: var(--space-2) 0 var(--space-3); }
  .app-prose .fb-table thead th { position: static; }
  .app-prose .fb-table td { white-space: normal; padding-top: var(--space-1);
    padding-bottom: var(--space-1); }
  .app-prose .fb-table td.fb-num { white-space: nowrap; }
  .app-prose .fb-table caption { padding-bottom: var(--space-1); text-align: left;
    color: var(--ink-muted); }
  .app-prose__note { color: var(--caution); }
  .app-prose__asof { color: var(--ink-muted); }
  .app-prose__row { margin-top: var(--space-2); }
  .app-prose span[data-policy], .app-prose span[data-count], .app-prose span[data-decile],
  .app-prose span[data-policy-version] {
    font-family: var(--font-mono); font-size: 0.92em;
    text-decoration: underline dotted var(--ink-faint); text-underline-offset: 3px;
  }
  .app-prose .is-changed { color: var(--accent); text-decoration-color: var(--accent); }
  .app-life { max-width: 960px; margin: var(--space-4) 0 var(--space-3); overflow-x: auto; }
  .app-life__svg { display: block; width: 100%; min-width: 800px; height: auto; }
  .app-prose .app-life__list {
    display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4);
    margin: var(--space-2) 0 0; padding: 0; list-style: none; color: var(--ink-muted);
  }
  .app-life__list li + li { margin-top: 0; }
  .app-toc ol { columns: 2 16rem; column-gap: var(--space-6); }
  .app-prose .app-phases { padding-left: 0; list-style: none; }
  .app-phases h3 { margin-top: var(--space-4); }
  .app-phases p { margin-bottom: var(--space-1); }
  .app-prose .app-flags { padding-left: 0; list-style: none; }
  .app-flags li + li { margin-top: var(--space-3); }
  .app-flags__what { display: block; margin-top: var(--space-1); }
  .app-link { color: var(--accent); }
  .app-link:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  /* A header that also drags keeps the bundle's grab cursor. */
  .fb-table thead th[tabindex]:not([draggable="true"]), .fb-table tbody tr[tabindex] {
    cursor: pointer;
  }
  .fb-table thead th[tabindex]:focus-visible, .fb-table tbody tr[tabindex]:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: -2px;
  }

  .app-drawer {
    min-height: 0; overflow-y: auto; background: var(--surface-raised);
    border: 1px solid var(--hairline); border-radius: var(--radius-lg);
  }
  .app-drawer__bar {
    position: sticky; top: 0; z-index: 4; display: flex; justify-content: flex-end;
    padding: var(--space-1) var(--space-2); background: var(--surface-raised);
    border-bottom: 1px solid var(--hairline);
  }
  .app-drawer__body { padding: var(--space-3) var(--space-4) var(--space-6); }
  /* Loading: the previous company, faded, until the new one lands. No spinner, no motion. */
  .app-drawer__body.is-loading { opacity: 0.5; }
  .app-drawer__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .app-drawer__ticker { margin: 0; }
  /* The company's logo (B-203). Most of FMP's logos are drawn for a white ground, many dark on
     a clear one, so the tile is white under either theme and reads no theme token; a logo whose
     marks are light where they meet its clear ground stands on a dark tile, one colour under
     either theme too (B-206; app.js, logoGround). The tile holds its place unseen until its
     image has loaded, so no empty tile shows while the server fetches. */
  .app-logo {
    flex: none; box-sizing: border-box; width: 24px; height: 24px; padding: 2px;
    background: #ffffff; border-radius: var(--radius-sm); object-fit: contain;
    visibility: hidden;
  }
  .app-logo.is-loaded { visibility: visible; }
  .app-logo.is-on-dark { background: #121417; }
  /* The moat stamp after the phase badge (the company page's design, 7.2): an outlined label in
     ink-muted, no fill and none of the phase colours, which mean the phase alone; dashed for a
     company with no row in the moat table, MOAT NOT SET (spec 2026-11-19 8.8). */
  .app-moat {
    display: inline-flex; align-items: center; padding: 0 var(--space-1); color: var(--ink-muted);
    background: none; border: 1px solid currentColor; border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .app-moat--unset { border-style: dashed; }
  .app-drawer__name { margin: 0; flex-basis: 100%; color: var(--ink-muted); }
  .app-drawer__currency { margin: 0; flex-basis: 100%; }
  /* The drawer's form A (the company page's design, 11): under the head the sector's caption and
     the company brief, cut at six lines with an ellipsis, the whole of it on the company page;
     the value band under a rule, the levels clear of the meter's caption, or a refused row's
     sentence in its place; then Company page and Request research on one line, the server's
     refusal and the open item's line under them. Request research's box stands from the row's
     right edge and under the row, not from its button (the watchlist page's design, 10): the two
     buttons fill the row, so when the drawer scrolls its scrollbar wraps them and Request research
     drops to the row's left, where a box from the button's right edge would stand past the
     drawer's left edge, which clips it. From the row it lies inside the drawer's width on one
     line or two. */
  .app-drawer__sector { margin: var(--space-2) 0 0; }
  .app-drawer__brief {
    margin: var(--space-1) 0 0; color: var(--ink-muted); display: -webkit-box;
    -webkit-box-orient: vertical; -webkit-line-clamp: 6; line-clamp: 6; overflow: hidden;
  }
  .app-drawer__band {
    margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--hairline);
  }
  .app-drawer__band .app-pairs { margin-top: var(--space-3); }
  /* A held value that expired early (spec 2026-11-23 held reviewed value, 5.7): one line under
     the levels, a button with no chrome that opens the reasons under it. */
  .app-held { margin-top: var(--space-3); }
  .app-held__line {
    padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer;
    text-align: left;
  }
  .app-held__line:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-held__detail { margin-top: var(--space-2); }
  .app-held__reason { margin: 0 0 var(--space-1); color: var(--ink-faint); }
  .app-held__detail .app-refusal { margin-bottom: var(--space-2); }
  .app-drawer__actions {
    position: relative; display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: var(--space-2); margin-top: var(--space-4);
  }
  .app-drawer__actions > p { flex-basis: 100%; margin: 0; }
  .app-drawer__actions .app-request { position: static; }
  .app-pairs {
    display: grid; grid-template-columns: max-content minmax(0, 1fr);
    gap: var(--space-1) var(--space-3); margin: 0; align-items: baseline;
  }
  .app-pairs dt { color: var(--ink-muted); }
  .app-pairs dd { margin: 0; overflow-wrap: anywhere; }
  /* The warnings mark before the drawer's Fair value (spec 2026-11-19 7.5) hangs in the 12px
     column gap: a negative left margin of its advance, 13.2px at 22px of the mono face, plus a
     1px right margin, so the four levels keep one left edge and the dot's ink stays clear of the
     label. The mark's own rule (bundle.css) serves the right-aligned screen and company page. */
  .app-drawer__band .app-pairs .fb-warnmark { margin-left: -14.2px; margin-right: 1px; }
  .app-group + .app-group { margin-top: var(--space-3); }
  .app-group__head { margin: 0 0 var(--space-1); color: var(--ink-muted); }
  .app-list { list-style: none; margin: 0; padding: 0; }
  .app-list li + li { margin-top: var(--space-2); }
  .app-list p { margin: 0; }
  .app-inputs th, .app-inputs td { padding: var(--space-2) var(--space-1); }
  .app-inputs td { vertical-align: top; white-space: normal; overflow-wrap: anywhere; }
  .app-inputs td.fb-num { white-space: nowrap; }
  /* A table of figures wider than its column, a secondary valuation's years, scrolls sideways on
     its own; the page does not. */
  .app-scroll { overflow-x: auto; }
  .app-scroll:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-scroll + .app-pairs { margin-top: var(--space-2); }
  .app-figures th, .app-figures td { padding: 0 var(--space-2); }
  /* The first column, the year, stays in view while the table scrolls sideways; on the panel's
     raised surface, above the header cells that scroll under it. */
  .app-figures th:first-child, .app-figures td:first-child {
    position: sticky; left: 0; background: var(--surface-raised);
  }
  .app-figures th:first-child { z-index: 1; }
  .app-line { display: block; }
  .app-nowrap { white-space: nowrap; }
  .app-muted { color: var(--ink-faint); }
  .app-refusal { margin: 0; color: var(--caution); }
  /* Request research (spec 2026-11-06 Tier 2, 18.2): its menu opens under its button from the
     button's right edge, as the company page's head needs it, the button standing at the page's
     right; the drawer stands it from its row of buttons instead (above; the watchlist page's
     design, 10). The menu's note line as wide as the menu, the box Open Claude Code a little
     under it; the server's refusal and the open item's line follow the button, the line's Open
     Claude Code or Open again set a little after its text (spec 2026-11-16 agent launch, 10). */
  .app-request { position: relative; display: inline-block; }
  .app-request .fb-menu { left: auto; right: 0; }
  .app-request__line { display: block; }
  .app-request__line .app-field { width: 100%; }
  .app-request__error { margin: var(--space-2) 0 0; color: var(--caution); }
  .app-requested { margin: var(--space-2) 0 0; color: var(--ink-muted); }
  .app-request__launch { margin-top: var(--space-2); }
  .app-request__open { margin-left: var(--space-2); }
  .app-secondary__path { margin-top: var(--space-2); }
  /* Notes (the company page's design, 11.1): the control at the left of the drawer's bar, Close
     staying at its right. Its box, the bundle's menu as the watchlist popup draws it, fixed where
     app.js places it under or over the control and wide enough for a note to read: the company's
     notes in a list that scrolls under 240px, faded while they are read, each note's text with
     its line breaks kept and its chip under it; the line of none or of a failed read in the
     list's place; under the list Add a note, the field as wide as the box, its button under it
     and a refusal under them. */
  .app-drawer__bar .app-notes-open { margin-right: auto; }
  .app-notes-box {
    position: fixed; top: auto; right: auto; box-sizing: border-box; width: 22rem;
    max-width: 100vw;
  }
  .app-notes-box__body { max-height: 240px; }
  .app-notes-box__body.is-loading { opacity: 0.5; }
  .app-notes-box__text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .app-notes-box__chip { margin-top: var(--space-1); }
  .app-notes-box__none { margin: 0; padding: 0 var(--space-1); }
  .app-notes-box__failed { margin: 0; padding: 0 var(--space-1); color: var(--caution); }
  .app-notes-box__new {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2);
  }
  .app-notes-box__field { width: 100%; resize: vertical; font-family: var(--font-sans); }
  .app-notes-box__error { margin: var(--space-2) 0 0; color: var(--caution); }
  /* The moat box (spec 2026-11-19 8.8 and 9), built as the Notes box is: the bundle's menu, fixed
     where app.js places it under or over the company page's control, as wide as the Notes box;
     in a column whose parts do not shrink inside the menu body's own scroll, the line that says
     whose the class is, an agent's chip inline in it and "Before: Narrow." kept whole, the reason
     with its line breaks kept, scrolling in an area of its own past six lines, the three classes
     in the Financials tab's segmented control at its left, and the field as wide as the box;
     under them Set moat class and the return to the file's class on one line, and a refusal
     under them. */
  .app-moat-box {
    position: fixed; top: auto; right: auto; box-sizing: border-box; width: 22rem;
    max-width: 100vw;
  }
  .app-moat-box__body {
    display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3);
  }
  .app-moat-box__body > * { flex: none; }
  .app-moat-box__whose { margin: 0; }
  .app-moat-box__before { white-space: nowrap; }
  .app-moat-box__reason {
    margin: 0; max-height: 120px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .app-moat-box__classes { align-self: flex-start; }
  .app-moat-box__field { width: 100%; resize: vertical; font-family: var(--font-sans); }
  .app-moat-box__buttons {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
  }
  .app-moat-box__error { margin: var(--space-2) 0 0; color: var(--caution); }
  /* A report's parts after its sections (report_parts.js), which the Research tab draws in its
     three closed parts (the Research tab's design, 7.8; its own rules below set each part's frame
     and title aside): each a panel on the raised surface with a hairline border and no shadow;
     the references numbered at the reading width; Appendix A's parts each under its heading,
     their records space-3 apart, an override's scaling at a split under its record (spec
     2026-11-15 8); the glossary. A read the server refused, its sentence in caution (charts.js). */
  .app-report__error { margin: var(--space-2) 0 0; color: var(--caution); }
  .app-report__panel {
    margin-top: var(--space-8); padding: var(--space-3) var(--space-4) var(--space-4);
    background: var(--surface-raised); border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
  }
  .app-report__panel > h3 { margin: 0 0 var(--space-3); }
  .app-report__notes { max-width: 72ch; margin: 0; padding: 0; list-style: none; }
  .app-report__notes li { overflow-wrap: anywhere; }
  .app-report__notes li + li { margin-top: var(--space-1); }
  .app-report__n { color: var(--ink-faint); }
  .app-report__part + .app-report__part { margin-top: var(--space-6); }
  .app-report__part > h4 { margin: 0 0 var(--space-2); }
  .app-report__part > p { max-width: 72ch; margin: 0; overflow-wrap: anywhere; }
  .app-report__part > p + * { margin-top: var(--space-2); }
  .app-report__part > .app-report__entered { margin-top: var(--space-1); color: var(--ink-muted); }
  .app-report__glossary { max-width: 72ch; margin: 0; }
  .app-report__glossary dd { margin: var(--space-1) 0 var(--space-3); }
  /* The report's charts (charts.js) on the Research tab: each with no panel of its own, on its
     section's panel (app-charts__chart); a read the server refused, its sentence in the chart's
     place. */
  .app-charts__chart { min-width: 0; }
  .app-charts__chart .app-report__error { margin: 0; }
  .app-charts__chart .fb-c + .app-report__error { margin-top: var(--space-2); }
  /* The company page (the company page's design, 7), as its mockup lays it out, with no link back
     to the screen (the decision log of 2026-11-17): the head, the logo on the drawer's tile at
     40px, the name, the ticker, the phase badge and the moat stamp over the caption line at its
     left, and at its right the price in figure-lg, the day's change in the text's own colour and
     the close's day, then the controls, Request research's menu opening from its button's right
     edge and its lines under the buttons; the tabs' row on a hairline, the open tab underlined in
     accent and the data date at its right end. Under it the open tab's blocks, the Overview's and
     the Estimates' in two columns, one column below 1180px (the Financials tab's one block and
     the Research tab have their own rules below): each block a raised panel with a hairline
     border, its title and the caption at its right in its head; in a block, lists of a name and a
     figure on hairlines, a figure on one line and a word or a name wrapping inside its half of
     the row, groups under their titles in label, and small tables of figures. Loading, the page
     keeps what it had, faded. */
  #company { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--space-6) var(--space-4); }
  .app-company { max-width: 1760px; padding: var(--space-2) 0 var(--space-8); }
  .app-company.is-loading { opacity: 0.5; }
  .app-company__head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: var(--space-3) var(--space-8);
  }
  .app-company__id { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .app-company__logo {
    width: 40px; height: 40px; padding: 4px; border-radius: var(--radius-md);
  }
  .app-company__names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .app-company__line {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  }
  .app-company__name { margin: 0; }
  .app-company__sub { margin: 0; color: var(--ink-muted); }
  .app-company__side {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-6);
  }
  .app-company__quote { display: flex; align-items: baseline; gap: var(--space-3); }
  .app-company__quote p { margin: 0; }
  .app-company__change { color: var(--ink-muted); }
  .app-company__at { color: var(--ink-faint); }
  .app-company__actions {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end;
    gap: var(--space-2);
  }
  .app-company__actions > p { flex-basis: 100%; margin: 0; text-align: right; }
  .app-company__tabs {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-1);
    margin-top: var(--space-4); border-bottom: 1px solid var(--hairline);
  }
  /* The tabs wrap onto a second line where the window cannot hold the five on one (the
     Investor relations tab's design, 7.8: nothing is wider than a 400px window), and the data
     date stands on a line of its own, at the row's right end, where it does not fit beside them. */
  .app-company__tablist { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .app-company__tab {
    appearance: none; margin: 0 0 -1px; padding: var(--space-2) var(--space-3); background: none;
    border: 0; border-bottom: 2px solid transparent; color: var(--ink-muted); cursor: pointer;
    text-decoration: none;
  }
  .app-company__tab:hover { color: var(--ink); }
  .app-company__tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .app-company__tab:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-company__asof { margin: 0 0 var(--space-2) auto; color: var(--ink-faint); }
  .app-company__grid {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-4);
    align-items: stretch; margin-top: var(--space-4);
  }
  .app-company__col { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .app-company__panel {
    min-width: 0; padding: var(--space-4); background: var(--surface-raised);
    border: 1px solid var(--hairline); border-radius: var(--radius-lg);
    container-type: inline-size;
  }
  .app-company__panelhead {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    margin: 0 0 var(--space-3);
  }
  .app-company__paneltitle { margin: 0; }
  .app-company__note { margin: 0; color: var(--ink-faint); }
  .app-company__grouptitle {
    margin: 0 0 var(--space-1); color: var(--ink-faint); text-transform: uppercase;
  }
  .app-kv { display: flex; flex-direction: column; }
  .app-kv__row {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3);
    padding: 5px 0; border-bottom: 1px solid var(--hairline);
  }
  .app-kv__row:last-child { border-bottom: 0; }
  .app-kv__k { color: var(--ink-muted); }
  .app-kv__v { text-align: right; white-space: nowrap; }
  .app-kv__v.body { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .app-company__table { width: 100%; border-collapse: collapse; }
  .app-company__table th {
    padding: 5px 0 5px var(--space-2); color: var(--ink-faint); font-weight: 500;
    text-align: right; text-transform: uppercase; border-bottom: 1px solid var(--hairline);
  }
  .app-company__table td {
    padding: 5px 0 5px var(--space-2); text-align: right; white-space: nowrap;
    border-bottom: 1px solid var(--hairline);
  }
  .app-company__table tr:last-child td { border-bottom: 0; }
  .app-company__table th:first-child, .app-company__table td:first-child {
    padding-left: 0; text-align: left;
  }
  .app-company__table td.app-company__rowname { color: var(--ink-muted); }
  /* The Overview's left column (the company page's design, 8.1 to 8.3), as its mockup lays it
     out: inside a block, two or three columns, three becoming two under 810px of the block's
     width and both one under 460px, as Price facts' three groups do too (8.5). At 810px each of
     three columns is as wide as the table of yearly rates a share needs with three negative
     three-figure rates in figure-sm on each row. In the two-column form the block's halves end
     near one another (the decision log of 2026-11-17): Key statistics' third stack spans both
     columns and lays its groups out in them, Growth beside the yearly rates a share, which span
     two rows, and Dividends under Growth; Price facts' first group, Trading, spans two rows beside
     the two price changes, one under the other. The company's brief in ink-muted, three lines
     while closed, Show more under it in accent; the meter clear of the levels; the report's line
     under a hairline rule. */
  .app-company__two {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 var(--space-8);
  }
  .app-company__three {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-4) var(--space-8); align-items: start;
  }
  @container (width < 810px) {
    .app-company__three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @container (460px <= width < 810px) {
    .app-company__three > .app-company__stack:last-child {
      display: grid; grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4) var(--space-8); align-items: start;
    }
    .app-company__three > .app-company__stack:last-child > :nth-child(2),
    .app-company__three > .app-company__group:first-child { grid-row: span 2; }
  }
  @container (width < 460px) {
    .app-company__two, .app-company__three { grid-template-columns: minmax(0, 1fr); }
  }
  .app-company__stack { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .app-company__brief { max-width: 86ch; margin: 0 0 var(--space-2); color: var(--ink-muted); }
  .app-company__brief.is-clamped {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3;
    overflow: hidden;
  }
  .app-company__more {
    appearance: none; margin: 0 0 var(--space-3); padding: 0; background: none; border: 0;
    color: var(--accent); cursor: pointer;
  }
  .app-company__more:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-company__meter { margin-bottom: var(--space-3); }
  .app-company__research {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
    margin: var(--space-3) 0 0; padding-top: var(--space-3); border-top: 1px solid var(--hairline);
  }
  .app-company__research p { margin: 0; color: var(--ink-muted); }
  /* The Overview's price chart (the company page's design, 8.4), as its mockup draws it: the
     ranges one row of buttons on a hairline in the block's head, the chosen one on accent-quiet;
     above the plot the newest close and the change over the range in ink-muted, the text's own
     colour; the plot as wide as the block, its ticks bare and monospaced in ink-faint, the plots'
     names in the sans, the tag's figure in on-accent; the plot's focus ringed; the box of the
     picked day over the plot, on the side with room. Nothing moves. */
  .app-price__ranges {
    display: inline-flex; border: 1px solid var(--hairline); border-radius: var(--radius-md);
    overflow: hidden;
  }
  .app-price__range {
    appearance: none; padding: 4px 9px; background: none; border: 0;
    border-right: 1px solid var(--hairline); color: var(--ink-muted); cursor: pointer;
  }
  .app-price__range:last-child { border-right: 0; }
  .app-price__range:hover { background: var(--surface-hover); color: var(--ink); }
  .app-price__range[aria-pressed="true"] { background: var(--accent-quiet); color: var(--ink); }
  .app-price__range:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-price__lead {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-3);
    margin: 0 0 var(--space-2);
  }
  .app-price__lead p { margin: 0; }
  .app-price__move { color: var(--ink-muted); }
  .app-price__plot { position: relative; }
  .app-price__plot:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-price__plot svg { display: block; width: 100%; }
  .app-price__plot text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-faint); }
  .app-price__plot .app-price__name { font-family: var(--font-sans); }
  .app-price__plot .app-price__tag { fill: var(--on-accent); font-weight: 500; }
  .app-price__tip {
    position: absolute; top: 4px; padding: 6px 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-popover); white-space: nowrap; pointer-events: none;
  }
  .app-price__tip p { margin: 0; }
  .app-price__tipname { margin-right: var(--space-2); color: var(--ink-muted); }
  /* The Overview's news (the company page's design, 8.6), as its mockup draws it: the count and
     the note why newer news did not load at the head's right end; each story on a hairline, its
     day in a narrow column in ink-faint, its title in the text's colour, in accent under the
     pointer where it is a link, its publisher under it in ink-faint. The list has no height of its
     own, so its stories never size the row, and scrolls inside its block (the columns' rule
     below), with a thin scrollbar and a focus ring for the keyboard. */
  .app-company__newshead {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: flex-end;
    gap: 0 var(--space-3); min-width: 0; text-align: right;
  }
  .app-company__news {
    flex: 1 1 0; height: 0; min-height: 0; overflow-y: auto;
    margin: 0 calc(var(--space-2) * -1) 0 0; padding: 0 var(--space-2) 0 0; list-style: none;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .app-company__news:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-company__news li {
    display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: var(--space-3);
    padding: 7px 0; border-bottom: 1px solid var(--hairline);
  }
  .app-company__news li:last-child { border-bottom: 0; }
  .app-company__newsday { padding-top: 2px; color: var(--ink-faint); }
  .app-company__newstitle { display: block; color: inherit; text-decoration: none; }
  a.app-company__newstitle:hover { color: var(--accent); }
  .app-company__newsby { margin: 1px 0 0; color: var(--ink-faint); }
  /* The Estimates tab's analysts (the company page's design, 9), as its mockup draws them: each
     part's title in label, upper case, in ink-faint, clear of what is above it; the five ratings
     in a row of boxes on the surface with a hairline border, each its count over its name in
     ink-faint, centred. */
  .app-company__subtitle {
    margin: var(--space-4) 0 var(--space-1); color: var(--ink-faint); text-transform: uppercase;
  }
  .app-company__grades {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-2);
  }
  .app-company__grade {
    padding: var(--space-2); background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius-md); text-align: center;
  }
  .app-company__grade p { margin: 0; }
  .app-company__gradename { color: var(--ink-faint); }
  /* The two columns end on one line, both ways (the company page's design, 8.7 and 9, and its
     decision log of 2026-11-17), as version 3 of the mockup has it: the grid stretches both
     columns to the row's height, which the taller column sets. The news list has no height of
     its own (above), so on the Overview the right column's least height is the chart, Price
     facts and News at its floor of 260px. Where the left column is the taller, News, the right
     one's last block, fills what is left, its list scrolling inside it; where the right column's
     least height is the greater, the left one's last block, Key statistics, grows to the row,
     blank at its foot, and News stands at its floor. On every other tab the last block of each
     column grows to the row, so the shorter one's takes what is left and nothing scrolls. Under
     1180px the page is one column, the right column's blocks after the left's, and the news list
     is as tall as its stories, scrolling under 520px. These rules follow the grid's and the news
     list's, which the narrow page's override. */
  .app-company__panel--fill {
    display: flex; flex-direction: column; flex: 1 1 0; min-height: 260px; box-sizing: border-box;
  }
  .app-company__col > .app-company__panel:last-child:not(.app-company__panel--fill) {
    flex: 1 1 auto;
  }
  @media (width < 1180px) {
    .app-company__grid { grid-template-columns: minmax(0, 1fr); }
    .app-company__panel--fill { flex: none; }
    .app-company__news { flex: none; height: auto; max-height: 520px; }
  }
  /* The Financials tab (the Financials tab's design, 7.2, 7.3 and 7.8), as its mockup draws it:
     one block the page's width under the tabs' row. Its row of controls wraps, the sub-tabs at its
     left, the two switches at its right, each a segmented control on a hairline, the chosen
     button on surface-selected and the focus ringed. The two captions on one line in ink-faint,
     wrapping. Each table in a box of its own that scrolls sideways, never the page: a column a
     period, its figures monospaced, its head the period over the day and month and a column's
     currency code in ink-faint; the first column the lines' names in ink-muted, in place as the
     table scrolls, on the block's own ground so the figures pass under it, and under 700px
     narrowed to 168px, a long name wrapping. A total in ink and bold, a sub-line indented, a
     section head in label over a line of border, its name in place too; a dash in ink-faint; the
     row under the pointer on surface-hover. A table with no line its sentence in ink-faint.
     Nothing moves. */
  .app-fin { margin-top: var(--space-4); }
  .app-fin__bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: var(--space-2) var(--space-4);
  }
  .app-fin__opts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .app-fin__seg {
    display: inline-flex; flex-wrap: wrap; border: 1px solid var(--hairline);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .app-fin__seg button {
    appearance: none; margin: 0; padding: 6px 12px; color: var(--ink-muted); background: none;
    border: 0; border-right: 1px solid var(--hairline); cursor: pointer;
  }
  .app-fin__seg button:last-child { border-right: 0; }
  .app-fin__seg button:hover { color: var(--ink); background: var(--surface-hover); }
  .app-fin__seg button[aria-selected="true"], .app-fin__seg button[aria-pressed="true"] {
    color: var(--ink); background: var(--surface-selected);
  }
  .app-fin__seg button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-fin__notes {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    gap: var(--space-1) var(--space-4); margin: var(--space-4) 0 var(--space-1);
    color: var(--ink-faint);
  }
  .app-fin__note { margin: 0; }
  .app-fin__title { margin: var(--space-5) 0 var(--space-1); }
  .app-fin__scroll { overflow-x: auto; }
  .app-fin__table { width: 100%; border-collapse: collapse; white-space: nowrap; }
  .app-fin__table th, .app-fin__table td {
    padding: 5px 0 5px var(--space-4); text-align: right; border-bottom: 1px solid var(--hairline);
  }
  .app-fin__table thead th { vertical-align: bottom; font-weight: 500; color: var(--ink-muted); }
  .app-fin__table thead th > span { display: block; color: var(--ink-faint); font-weight: 400; }
  .app-fin__table th:first-child, .app-fin__table td:first-child {
    position: sticky; left: 0; z-index: 1; min-width: 232px;
    padding-right: var(--space-2); padding-left: var(--space-2);
    text-align: left; font-family: var(--font-sans); font-weight: 400;
    background: var(--surface-raised); color: var(--ink-muted);
  }
  .app-fin__table thead th:first-child { color: var(--ink-faint); }
  .app-fin__table tbody tr:hover th, .app-fin__table tbody tr:hover td {
    background: var(--surface-hover);
  }
  .app-fin__table tr.is-total th, .app-fin__table tr.is-total td {
    color: var(--ink); font-weight: 600;
  }
  .app-fin__table tr.is-sub th { padding-left: var(--space-6); }
  .app-fin__table tr.is-head th {
    padding-top: var(--space-4); color: var(--ink-faint); font-weight: 500;
    border-bottom-color: var(--border);
  }
  .app-fin__table tr.is-head th > span { position: sticky; left: var(--space-2); }
  .app-fin__table tbody tr.is-head:hover th { background: var(--surface-raised); }
  .app-fin__table td.is-nil { color: var(--ink-faint); }
  .app-fin__none { margin: var(--space-2) 0 0; color: var(--ink-faint); }
  /* A line's row takes a press (7.3 and 7.4): the pointer's hand; a section head none. A row on
     the chart on surface-selected, its name in ink, with a 2px bar of its line's colour at its
     left edge. A line's colour is its slot's: is-s0 to is-s3 set chart-1 to chart-4 as the
     series colour its row, its swatches, its label and its marks wear, never its text. The focus
     ringed by the row's own cells, since the names' sticky column would cover a ring on the row;
     on a row on the chart the ring's left edge takes the bar's place while it has the focus. */
  .app-fin__table tbody tr { cursor: pointer; }
  .app-fin__table tbody tr.is-head { cursor: default; }
  .app-fin__table tbody tr.is-on th, .app-fin__table tbody tr.is-on td {
    background: var(--surface-selected);
  }
  .app-fin__table tbody tr.is-on th:first-child {
    color: var(--ink); box-shadow: inset 2px 0 0 var(--fin-series);
  }
  .app-fin .is-s0 { --fin-series: var(--chart-1); }
  .app-fin .is-s1 { --fin-series: var(--chart-2); }
  .app-fin .is-s2 { --fin-series: var(--chart-3); }
  .app-fin .is-s3 { --fin-series: var(--chart-4); }
  /* A row's button before its name (7.3): + in ink-faint while its line is off the chart, the
     line's swatch while it is on it, framed under the pointer and ringed with the focus; faded
     where the chart holds four lines. A swatch, in a row's button, a label or the box, is 10px,
     a square for bars and a round dot for a line, in its line's colour. */
  .app-fin__add {
    appearance: none; display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; margin: -1px var(--space-1) -1px calc(-1 * var(--space-1));
    padding: 0; vertical-align: middle; font-family: var(--font-mono); font-size: 13px;
    line-height: 1; color: var(--ink-faint); background: none; border: 1px solid transparent;
    border-radius: var(--radius-sm); cursor: pointer;
  }
  .app-fin__table tbody tr:hover .app-fin__add:not(:disabled), .app-fin__add:focus-visible {
    color: var(--ink); border-color: var(--border);
  }
  .app-fin__add:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .app-fin__add:disabled { opacity: 0.35; cursor: not-allowed; }
  .app-fin__swatch, .app-fin__key {
    display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px;
    background: var(--fin-series);
  }
  .app-fin__swatch--round, .app-fin__key--round { border-radius: 50%; }
  .app-fin__table tbody tr:focus-visible { outline: none; }
  .app-fin__table tbody tr:focus-visible > th, .app-fin__table tbody tr:focus-visible > td {
    box-shadow: inset 0 2px 0 var(--focus-ring), inset 0 -2px 0 var(--focus-ring);
  }
  .app-fin__table tbody tr:focus-visible > th:first-child {
    box-shadow: inset 2px 0 0 var(--focus-ring), inset 0 2px 0 var(--focus-ring),
      inset 0 -2px 0 var(--focus-ring);
  }
  .app-fin__table tbody tr:focus-visible > td:last-child {
    box-shadow: inset -2px 0 0 var(--focus-ring), inset 0 2px 0 var(--focus-ring),
      inset 0 -2px 0 var(--focus-ring);
  }
  /* The chart (7.5), as the mockup draws it: over a hairline above the captions, its place gone
     where it draws nothing. Its head on one line that wraps, the name, the newest figure and the
     period and unit in ink-faint. The plot as wide as the block, its focus ringed; its ticks and
     the periods' labels monospaced in ink-faint; the grid solid in chart-grid, the zero line and
     the crosshair in border. Each mark wears its series colour: the bars, the dots and the
     markers filled, the line a 2px stroke with round joins and caps, the end marker and the
     hover's marker ringed in surface-raised; a lone line's bar below zero in chart-neg-3; the
     bars of the periods not picked faded. The box over the mark on surface-raised. Nothing
     moves. */
  .app-fin__chart {
    margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--hairline);
  }
  .app-fin__chart:empty { display: none; }
  .app-fin__chead {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-3);
    min-height: 28px;
  }
  .app-fin__chead > * { margin: 0; }
  .app-fin__unit { color: var(--ink-faint); }
  .app-fin__plot { position: relative; margin-top: var(--space-1); }
  .app-fin__plot:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-fin__plot svg { display: block; width: 100%; }
  .app-fin__plot text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-faint); }
  .app-fin__grid { stroke: var(--chart-grid); stroke-width: 1; }
  .app-fin__zero, .app-fin__cross { stroke: var(--border); stroke-width: 1; }
  .app-fin__col, .app-fin__dot, .app-fin__end, .app-fin__mark { fill: var(--fin-series); }
  .app-fin__line {
    fill: none; stroke: var(--fin-series); stroke-width: 2; stroke-linejoin: round;
    stroke-linecap: round;
  }
  .app-fin__end, .app-fin__mark { stroke: var(--surface-raised); stroke-width: 2; }
  .app-fin__col.is-neg { fill: var(--chart-neg-3); }
  .app-fin__col.is-dim { opacity: 0.45; }
  .app-fin__tip {
    position: absolute; z-index: 2; padding: 4px 8px; transform: translateY(-100%);
    color: var(--ink); background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-popover); white-space: nowrap;
    pointer-events: none;
  }
  /* The chart of several lines (7.5), as the mockup draws it: the labels on one line that wraps,
     each on surface in a hairline frame, in ink, its x in ink-faint, framed under the pointer and
     ringed with the focus; a label that is off in ink-faint, its swatch faded. Each plot's unit
     at its top left in the sans face. Where no line draws, the sentence in ink-faint. The box of
     several beside the period, under its top: the period in ink-muted, then a row a line, its
     swatch, its name and its figure at the right. */
  .app-fin__legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-2); padding: 0;
    list-style: none;
  }
  .app-fin__label {
    display: inline-flex; align-items: center; gap: 6px; min-height: 22px;
    padding: 2px 2px 2px var(--space-2); color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: var(--radius-md);
  }
  .app-fin__label.is-off { color: var(--ink-faint); }
  .app-fin__label.is-off .app-fin__key { opacity: 0.4; }
  .app-fin__x {
    appearance: none; width: 22px; height: 22px; margin: 0; padding: 0; font: inherit;
    font-size: 15px; line-height: 1; color: var(--ink-faint); background: none; border: 0;
    border-radius: var(--radius-sm); cursor: pointer;
  }
  .app-fin__x:hover { color: var(--ink); background: var(--surface-hover); }
  .app-fin__x:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .app-fin__plot .app-fin__measure { font-family: var(--font-sans); }
  .app-fin__blank { margin: var(--space-3) 0 0; color: var(--ink-faint); }
  .app-fin__tip--rows { transform: none; }
  .app-fin__tipwhen { color: var(--ink-muted); }
  .app-fin__tiprow { display: flex; align-items: center; gap: 6px; }
  .app-fin__tiprow .figure-sm { margin-left: auto; padding-left: var(--space-3); }
  @media (width < 700px) {
    .app-fin__table th:first-child, .app-fin__table td:first-child {
      min-width: 168px; white-space: normal;
    }
  }
  /* The Investor relations tab (the Investor relations tab's design, 7.2), as its mockup draws
     it: one block the page's width under the tabs' row. At its top a row over a hairline: the
     switch of the two views at its left, the Financials tab's segmented control (.app-fin__seg),
     and at its right end the line of the next earnings report in ink-muted, its day in ink; the
     row wraps, the line to the right end of a row of its own where the two do not fit. A view's
     sentence for nothing on file in ink-faint, under the row. The tokens' colours alone; nothing
     moves. */
  .app-ir { margin-top: var(--space-4); }
  .app-ir__bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-5);
    padding-bottom: var(--space-3); border-bottom: 1px solid var(--hairline);
  }
  .app-ir__next { margin: 0 0 0 auto; color: var(--ink-muted); }
  .app-ir__day { color: var(--ink); font-weight: 500; }
  .app-ir__none { margin: var(--space-4) 0 0; color: var(--ink-faint); }
  /* The Earnings calls view (the Investor relations tab's design, 7.3 and 7.4), as its mockup
     lays it out: the list of calls 236px wide at the left, staying in view while the transcript
     scrolls and scrolling on its own where it is longer than the window; its fiscal years' heads
     in label, ink-faint and upper case; each row on a 2px hairline at its left edge, its quarter
     and its day in ink-muted, the call shown on surface-selected with a 2px accent edge, as the
     Research tab marks its section; Show all under the rows. At the right the reader: the title
     at 18px on a 24px line, its day in ink-muted; the four figures in a row on surface, framed
     and parted by hairlines, each name in label and ink-faint over its figure in the text's own
     colour; the find box framed in border, its count in ink-muted and Go to the questions beside
     it; the transcript at the reading width, 15px on a 23px line, a turn a block over a hairline,
     the speaker's name in 600, the operator's in ink-faint, a long word wrapping; the questions'
     first turn under a heavier rule and its label in ink-faint. A found word on the accent's
     quiet tint, the find being the reader's own act, in the text's own colour. The reader faded
     while its call's read is out. The tokens' colours alone; nothing moves. */
  .app-ir__calls {
    display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: var(--space-6);
    align-items: start; margin-top: var(--space-4);
  }
  .app-ir__list {
    position: sticky; top: var(--space-3); display: flex; flex-direction: column;
    max-height: 78vh; overflow-y: auto;
  }
  .app-ir__group { display: flex; flex-direction: column; }
  .app-ir__year {
    margin: var(--space-3) 0 var(--space-1); color: var(--ink-faint); text-transform: uppercase;
  }
  .app-ir__group:first-child .app-ir__year { margin-top: 0; }
  .app-ir__call {
    appearance: none; box-sizing: border-box; display: flex; align-items: baseline;
    justify-content: space-between; gap: var(--space-2); width: 100%; margin: 0;
    padding: 6px 10px; text-align: left; color: var(--ink-muted); background: none;
    border: 0; border-left: 2px solid var(--hairline); cursor: pointer;
  }
  .app-ir__call:hover { color: var(--ink); background: var(--surface-hover); }
  .app-ir__call[aria-current="true"] {
    color: var(--ink); background: var(--surface-selected); border-left-color: var(--accent);
  }
  .app-ir__call:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-ir__date { color: var(--ink-muted); }
  .app-ir__all { align-self: flex-start; margin-top: var(--space-3); }
  .app-ir__reader { min-width: 0; }
  .app-ir__reader[aria-busy="true"] { opacity: 0.5; }
  .app-ir__title { margin: 0; font-size: 18px; line-height: 24px; overflow-wrap: anywhere; }
  .app-ir__when { margin: 2px 0 0; color: var(--ink-muted); }
  .app-ir__figures {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: var(--space-3);
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-md);
  }
  .app-ir__figure { min-width: 0; padding: 10px 14px; border-right: 1px solid var(--hairline); }
  .app-ir__figure:last-child { border-right: 0; }
  .app-ir__name { margin: 0; color: var(--ink-faint); text-transform: uppercase; }
  .app-ir__amount { margin: 2px 0 0; }
  .app-ir__tools {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) 14px;
    margin-top: var(--space-4);
  }
  .app-ir__find {
    flex: 0 1 260px; min-width: 0; margin: 0; padding: 6px 10px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .app-ir__find:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-ir__count { color: var(--ink-muted); }
  .app-ir__turns { max-width: 46rem; margin-top: var(--space-2); }
  .app-ir__turn {
    padding: 14px 0; border-top: 1px solid var(--hairline); scroll-margin-top: var(--space-3);
  }
  .app-ir__turn:first-child { border-top: 0; }
  .app-ir__turn--questions { margin-top: var(--space-5); border-top: 2px solid var(--hairline); }
  .app-ir__part { margin: 0 0 var(--space-2); color: var(--ink-faint); text-transform: uppercase; }
  .app-ir__who { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .app-ir__who--operator { color: var(--ink-faint); font-weight: 500; }
  .app-ir__words { margin: 6px 0 0; font-size: 15px; line-height: 23px; overflow-wrap: anywhere; }
  .app-ir__words mark {
    color: inherit; background: var(--accent-quiet); border-radius: var(--radius-sm);
  }
  /* Below 860px (7.8) the list of calls stands over the reader, in a box of its own on a hairline
     that scrolls, and the four figures stand one under the other, parted by hairlines; nothing is
     wider than a 400px window. */
  @media (width < 860px) {
    .app-ir__calls { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
    .app-ir__list {
      position: static; max-height: 240px; padding: 10px; border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
    }
    .app-ir__figures { grid-template-columns: minmax(0, 1fr); }
    .app-ir__figure { border-right: 0; border-bottom: 1px solid var(--hairline); }
    .app-ir__figure:last-child { border-bottom: 0; }
  }
  /* The Filings view (the Investor relations tab's design, 7.5 and 7.8), as its mockup lays it
     out: the filters in a row that wraps, each a pill framed in a hairline, in ink-muted, its
     count in ink-faint, the pressed one on surface-selected with an accent edge; then the table
     in a box of its own that scrolls sideways, so a narrow window scrolls the table and never the
     page: its head in label and ink-faint, each row over a hairline, the day, the form in 500 and
     the links on one line, the plain words in ink-muted, the links apart; under it the line of
     the windows read in ink-muted and Show older filings, wrapping. The view faded while an older
     window's read is out. The tokens' colours alone; nothing moves. */
  .app-ir__filings { margin-top: var(--space-4); }
  .app-ir__filings[aria-busy="true"] { opacity: 0.5; }
  .app-ir__filters { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .app-ir__filter {
    appearance: none; margin: 0; padding: 4px 12px; color: var(--ink-muted); background: none;
    border: 1px solid var(--hairline); border-radius: var(--radius-pill); cursor: pointer;
  }
  .app-ir__filter:hover { color: var(--ink); background: var(--surface-hover); }
  .app-ir__filter[aria-pressed="true"] {
    color: var(--ink); background: var(--surface-selected); border-color: var(--accent);
  }
  .app-ir__filter:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .app-ir__n { color: var(--ink-faint); }
  .app-ir__scroll { margin-top: var(--space-3); overflow-x: auto; }
  .app-ir__table { width: 100%; min-width: 560px; border-collapse: collapse; }
  .app-ir__table th {
    padding: 8px 10px; text-align: left; color: var(--ink-faint); font-weight: 500;
    text-transform: uppercase; border-bottom: 1px solid var(--hairline);
  }
  .app-ir__table td {
    padding: 8px 10px; text-align: left; vertical-align: baseline;
    border-bottom: 1px solid var(--hairline);
  }
  .app-ir__filed, .app-ir__form, .app-ir__links { white-space: nowrap; }
  .app-ir__form { font-weight: 500; }
  .app-ir__what { color: var(--ink-muted); }
  .app-ir__link + .app-ir__link { margin-left: var(--space-3); }
  .app-ir__foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4);
    margin-top: var(--space-3);
  }
  .app-ir__window { margin: 0; color: var(--ink-muted); }
  /* The company page's Research tab (the Research tab's design, 7.2 to 7.9), as its
     mockup lays it out. Under the tabs' row the bar: Report and Records, a segmented control on a
     hairline, the chosen one on surface-selected; the report's line in ink-muted; Footnote marks
     and Download .md at its right end; under it what the figures are in, in caption and
     ink-faint, and its notes. Then the section list, 196px wide,
     which stays in view while the report scrolls: its groups' heads in label and ink-faint, each
     name on a 2px hairline at its left edge, the one in view on surface-selected with a 2px accent
     edge, as the app marks a selection, and so the report on file shown. Beside it the panels,
     each on surface-raised with a hairline border: the heading at 18px on a 24px line; the text at
     the reading width, 16px on a 24px line; a wide table across the panel, the whole width where
     a cell is long; named lists side by side over a hairline; the two sides in two columns; the
     cards, each on surface with a hairline border, in a column beside the first run of text that
     stays in view while the panel scrolls, their text at 14px, a named block's name the label's,
     a table's cells after the first set right. A card's head: its name in label and ink-muted,
     the word on what it holds at its right in ink-faint; its records one under another on
     hairlines, a state in an outlined stamp, accent where a judgment changed; its line under it
     in ink-faint.
     The report's call: the value in figure-lg beside its kind, the meter, the levels in words,
     each keyed by its zone's colour. The judgments' cards in a row under the text. A paragraph of
     the financial section beside its group's charts, 27rem wide, each pair over a hairline; the
     charts with no panel, in a grid of their own, wider where a row holds them alone; the
     earnings call's three by quarter in such a grid. A cite in the text's colour over a dotted
     line in border, accent under the pointer and with the focus, with no line in an agent's
     table; its [n] hidden until Footnote marks is on; its source in a box on surface-raised over
     the page. The three parts kept closed, a head that opens each, + or − before its name;
     inside, the report's parts (report_parts.js), their panel's frame and title left to the
     head, the references in two columns where the width allows. Records (7.10): its count after
     its name in ink-faint; the panels in two columns, one below 980px, a panel with records
     across both, each framed as a section's, its name and count in its head, the ledger's note at
     the right in ink-faint; a table on hairlines that scrolls sideways where it must, its heads
     in label and ink-muted, its figures set right in mono, its days and times in ink-muted, its
     states in the outlined stamp and a review's word in the screen's chip; a review's row a
     press, on surface-hover under the pointer and surface-selected while open, its bridge in a
     row under it; "None on file." in ink-faint. */
  .app-research {
    display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-4);
  }
  .app-research__top { display: flex; flex-direction: column; gap: var(--space-2); }
  .app-research__bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-5);
  }
  .app-research__views {
    display: inline-flex; flex-wrap: wrap; border: 1px solid var(--hairline);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .app-research__view {
    appearance: none; margin: 0; padding: 6px 12px; color: var(--ink-muted); background: none;
    border: 0; border-right: 1px solid var(--hairline); cursor: pointer;
  }
  .app-research__view:last-child { border-right: 0; }
  .app-research__view:hover { color: var(--ink); background: var(--surface-hover); }
  .app-research__view[aria-selected="true"] {
    color: var(--ink); background: var(--surface-selected);
  }
  .app-research__view:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-research__line {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3);
    margin: 0; color: var(--ink-muted);
  }
  .app-research__actions {
    display: flex; flex-wrap: wrap; gap: var(--space-2); margin-left: auto;
  }
  .app-research__note, .app-research__none { margin: 0; color: var(--ink-muted); }
  .app-research__currency { margin: 0; }
  .app-research__error { margin: 0; color: var(--caution); }
  .app-research__layout {
    display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: var(--space-6);
    align-items: start;
  }
  .app-research__list {
    position: sticky; top: var(--space-3); display: flex; flex-direction: column;
    gap: var(--space-5); max-height: calc(100vh - 24px); overflow-y: auto;
  }
  .app-research__group { display: flex; flex-direction: column; gap: 6px; }
  .app-research__grouphead { margin: 0; color: var(--ink-faint); }
  .app-research__links, .app-research__files {
    display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none;
  }
  .app-research__link {
    appearance: none; box-sizing: border-box; display: flex; align-items: baseline;
    justify-content: space-between; gap: var(--space-2); width: 100%; margin: 0;
    padding: 5px 8px 5px 10px; text-align: left; color: var(--ink-muted); background: none;
    border: 0; border-left: 2px solid var(--hairline); cursor: pointer;
  }
  .app-research__link:hover { color: var(--ink); background: var(--surface-hover); }
  .app-research__link.is-on {
    color: var(--ink); background: var(--surface-selected); border-left-color: var(--accent);
  }
  .app-research__link:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-research__n { color: var(--ink-faint); }
  .app-research__file {
    display: flex; flex-direction: column; gap: 2px; padding: 6px 8px 6px 10px;
    color: var(--ink); text-decoration: none; border-left: 2px solid var(--hairline);
  }
  .app-research__file.is-on {
    background: var(--surface-selected); border-left-color: var(--accent);
  }
  a.app-research__file:hover { background: var(--surface-hover); }
  a.app-research__file:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .app-research__what { color: var(--ink-muted); }
  .app-research__main { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .app-research__sec, .app-research__panel {
    min-width: 0; padding: var(--space-5) var(--space-6) var(--space-6);
    background: var(--surface-raised); border: 1px solid var(--hairline);
    border-radius: var(--radius-lg); scroll-margin-top: var(--space-3);
  }
  .app-research__title { margin: 0 0 14px; font-size: 18px; line-height: 24px; }
  .app-research__body { display: flex; flex-direction: column; gap: var(--space-5); }
  .app-research__run {
    display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; max-width: 43rem;
  }
  .app-research .fb-report__prose, .app-research .fb-report__list,
  .app-research .fb-report__scroll { margin: 0; }
  .app-research .fb-report__prose, .app-research .fb-report__list {
    font-size: 16px; line-height: 24px; overflow-wrap: anywhere;
  }
  .app-research__wide { min-width: 0; }
  .app-research__wide--full .fb-report__table { width: 100%; }
  .app-research__columns {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: var(--space-5) var(--space-8); padding-top: 18px; border-top: 1px solid var(--hairline);
  }
  .app-research__sides {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
    gap: var(--space-5) var(--space-10);
  }
  .app-research__named, .app-research__side {
    display: flex; flex-direction: column; gap: var(--space-2); min-width: 0;
  }
  .app-research__name { margin: 0; color: var(--ink-muted); }
  .app-research .app-research__name > .fb-report__prose {
    max-width: none; font: inherit; letter-spacing: inherit; text-transform: inherit;
    color: inherit;
  }
  /* A section's first run of text and its cards (7.4): a row that wraps, so the panel's own
     width, not the window's, decides. The text takes at least 28rem and at most the reading
     width (its 43rem), growing to it first; the cards at least 300px, taking what is left. Where
     the panel holds both side by side they stand side by side, the cards' column in view while
     the panel scrolls; where it cannot, the cards wrap under the text across the panel, and,
     the last in the row, they have no room to move there. */
  .app-research__split {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-5) var(--space-8);
  }
  .app-research__split > .app-research__run { flex: 10 1 28rem; }
  .app-research__split > .app-research__cards { flex: 1 1 300px; }
  .app-research__cards {
    position: sticky; top: var(--space-3); display: flex; flex-direction: column;
    gap: var(--space-3); min-width: 0;
  }
  .app-research__card {
